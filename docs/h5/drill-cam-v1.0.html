<style>
  :root {

    --red: #c43c2e; --ok: #e8d7c3; --glow: #e85a2a; --glow2: #3aa0c8;
    --dummy-w: 46%;
    --dummy-h: 76%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #0d0b09; color: var(--ok);
    font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .phone {
    width: 100%; max-width: 420px; margin: 0 auto; min-height: 100dvh; height: 100%;
    position: relative; overflow: hidden; display: block;
    container-type: size; container-name: phone;

      linear-gradient(180deg, #2a1c14 0%, #12100e 55%, #0a0908 100%);
  }
  .stage-col, .rail, .arm-side, .side-left { display: contents; }
  .cam-wrap {
    position: absolute; left: 10px; top: 156px; width: 104px; height: 128px;
    z-index: 6; border-radius: 10px; overflow: hidden;
    background: #000; border: 2px solid rgba(232,215,195,0.55);
  }
  .cam-wrap.lost { border-style: dashed; border-color: rgba(232,215,195,0.35); }
  .cam-wrap video, .cam-wrap canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1);
  }
  .cam-wrap canvas { pointer-events: none; }
  .cam-status {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;

  }
  .cam-status:empty { display: none; }
  .topbar {
    position: absolute; top: 8px; left: 0; right: 0; text-align: center;
    font-size: 11px; letter-spacing: 0.18em; color: rgba(232,215,195,0.35); z-index: 8;
  }
  .topbar:empty { display: none; }
  .topbar.contest { color: rgba(196,60,46,0.85); }
  .hud {
    position: absolute; top: 28px; right: 10px; left: 10px; z-index: 8;
    background: var(--card); border: 1px solid rgba(196,60,46,0.55);
    border-radius: 12px; padding: 8px 10px 10px; pointer-events: none;
    display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: start;
  }
  .hud.urgent { box-shadow: 0 0 0 1px var(--red); }
  .timer-wrap { width: 52px; height: 52px; position: relative; }
  .timer-wrap svg { width: 52px; height: 52px; transform: rotate(-90deg); }
  .timer-wrap .t {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .hud-main { min-width: 0; }
  .step-tag { font-size: 14px; font-weight: 700; color: #fff; }
  .step-tag.punch { color: #ffb089; }
  .step-tag.bong { color: #8fd3ef; }
  .instr { font-size: 10px; line-height: 1.35; color: #f0e6da; margin-top: 2px; }
  .count { font-size: 12px; margin-top: 2px; opacity: 0.85; }
  .seq {
    position: static; margin-top: 6px;
    display: flex; flex-wrap: wrap; gap: 3px; pointer-events: none;
  }
  .seq span {
    width: 20px; height: 20px; border-radius: 5px; font-size: 9px; font-weight: 700;
    display: grid; place-items: center; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.12); color: rgba(232,215,195,0.45);
  }
  .seq span.punch { border-color: rgba(232,90,42,0.45); }
  .seq span.bong { border-color: rgba(58,160,200,0.45); }
  .seq span.done { background: rgba(232,215,195,0.2); color: var(--ok); }
  .seq span.cur.punch { background: rgba(232,90,42,0.35); color: #fff; border-color: var(--glow); }
  .seq span.cur.bong { background: rgba(58,160,200,0.35); color: #fff; border-color: var(--glow2); }

  .stage { position: absolute; inset: 0; }
  .dummy {
    position: absolute;
    left: 16%;
    width: 80%;
    height: min(78vw, 320px);
    height: 76cqmin;
    top: max(188px, calc(46% - 38cqmin));
    z-index: auto;
  }
  .pole {
    position: absolute; left: 50%; top: 0; bottom: 2%; width: 34%;
    transform: translateX(-50%);
    border-radius: 28px;
    z-index: 2;
    background: linear-gradient(90deg, #2a1812 0%, #6b4634 32%, #b18464 48%, #5a3828 68%, #24160f 100%);
  }
  .arm, .leg {
    position: absolute; border-radius: 999px; z-index: 2;
    background: linear-gradient(180deg, #8d6248, #3a241c 70%);
  }
  .arm.lu { width: 40%; height: 12%; left: 2%; top: 36%; transform: rotate(14deg); }
  .arm.ru { width: 46%; height: 13%; left: 44%; top: 8%; transform: rotate(-11deg); }
  .arm.mid { width: 44%; height: 13%; left: 48%; top: 42%; transform: rotate(-7deg); }
  .leg { width: 12%; height: 26%; left: 58%; top: 72%; transform: rotate(18deg); transform-origin: top center; }
  .arm.target-punch, .arm.target-bong { z-index: 9; }
  .arm.target-punch {
    color: var(--glow);
    outline: 4px solid var(--glow);
    box-shadow: 0 0 16px rgba(232,90,42,0.8);
    animation: blink 1s ease infinite;
  }
  .arm.target-bong {
    color: var(--glow2);
    outline: 4px solid var(--glow2);
    box-shadow: 0 0 16px rgba(58,160,200,0.75);
    animation: blink2 1s ease infinite;
  }
  .arm.target-punch::after, .arm.target-bong::after {
    content: "";
    position: absolute; right: 0; top: 50%;
    height: 180%; aspect-ratio: 1;
    transform: translate(42%, -50%);
    border-radius: 50%;
    border: 3px solid currentColor;
    box-shadow: 0 0 12px currentColor;
    pointer-events: none;
  }
  @container phone (max-height: 520px) {
    .dummy {
      left: 116px;
      width: 150px;
      top: 142px;
      height: calc(100% - 268px);
    }
    .arm.ru { width: 42%; left: 52%; top: 16%; }
    .arm.mid { width: 40%; left: 50%; }
  }
  .arm.hit { filter: brightness(1.35); }
  @keyframes blink { 50% { outline-color: rgba(232,90,42,0.2); } }
  @keyframes blink2 { 50% { outline-color: rgba(58,160,200,0.2); } }

  .demo-card {
    position: absolute; bottom: calc(148px + env(safe-area-inset-bottom, 0px)); right: 10px;
    width: min(28vw, 136px); max-width: 136px;
    padding: 7px 8px 8px; border-radius: 12px;
    background: rgba(12,14,18,0.55); border: 1.5px solid rgba(232,90,42,0.75);
    box-shadow: 0 6px 16px rgba(0,0,0,0.28);
    pointer-events: none !important; z-index: 3;
    transition: box-shadow 0.2s, border-color 0.2s, background 0.2s;
  }
  .demo-card.ok-flash {
    border-color: #3ecf7a;
    background: rgba(20,40,28,0.72);
    box-shadow: 0 0 0 2px rgba(62,207,122,0.45), 0 6px 16px rgba(0,0,0,0.28);
  }
  .demo-label {
    font-size: 10px; letter-spacing: 0.08em; color: var(--glow);
    font-weight: 700; margin-bottom: 2px;
  }
  .demo-cmd {
    font-size: 13px; font-weight: 700; color: #f3ebe0; margin-bottom: 2px;
  }
  .demo-hint {
    margin-top: 4px; font-size: 10px; line-height: 1.3;
    color: rgba(232,215,195,0.78);
  }
  .sil {
    position: relative; width: 100%; height: 86px; margin: 0 auto;
    opacity: 0.92;
  }
  .sil svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .sil .fig { fill: none; stroke: rgba(232,215,195,0.8); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .sil .ghost { stroke: rgba(232,215,195,0.22); stroke-width: 2; stroke-dasharray: 3 4; fill: none; }
  .sil .pose-punch, .sil .pose-bong { display: none; }
  .sil.punch .pose-punch { display: block; }
  .sil.bong .pose-bong { display: block; }
  /* 冲：蓄—斜上伸臂到位—停 0.35s ≈ 1.0s */
  .sil.punch .pose-punch .arm-line {
    transform-box: fill-box; transform-origin: 42px 48px;
    animation: punchLoop 1s ease-in-out infinite;
  }
  .sil.punch .pose-punch .fist {
    transform-box: fill-box; transform-origin: center;
    animation: punchLoop 1s ease-in-out infinite;
  }
  .sil.punch .pose-punch .glow-dot {
    animation: punchGlow 1s ease-in-out infinite;
  }
  @keyframes punchLoop {
    0%, 8% { transform: translate(-10px, 6px) scale(0.92); }
    42% { transform: translate(0, 0) scale(1); }
    77%, 100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes punchGlow {
    0%, 35% { opacity: 0.15; }
    45%, 80% { opacity: 1; }
    100% { opacity: 0.35; }
  }
  /* 膀：斜下伸臂—停 0.35s ≈ 1.0s */
  .sil.bong .pose-bong .bridge {
    transform-box: fill-box; transform-origin: 46px 56px;
    animation: bongLoop 1s ease-in-out infinite;
  }
  .sil.bong .pose-bong .glow-bridge {
    animation: punchGlow 1s ease-in-out infinite;
  }
  @keyframes bongLoop {
    0%, 10% { transform: rotate(14deg) translateY(4px); }
    45% { transform: rotate(0) translateY(0); }
    80%, 100% { transform: rotate(0) translateY(0); }
  }
  .sil.strike { filter: drop-shadow(0 0 6px rgba(62,207,122,0.85)); }

  .sfx {
    position: absolute; left: 58%; top: 42%; transform: translate(-50%,-50%);
    font-size: 22px; font-weight: 700; opacity: 0; pointer-events: none; z-index: 9;
    text-shadow: 0 2px 8px #000;
  }
  .sfx.show { animation: pop 0.4s ease forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%,-40%) scale(0.85); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-75%) scale(1.1); }
  }
  .flash { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .flash.ok { background: rgba(232,215,195,0.07); }
  .flash.bad { background: rgba(120,120,120,0.12); }
  .banner {
    position: absolute; left: 50%; top: 48%; transform: translate(-50%,-50%);
    z-index: 9; font-size: 13px; padding: 6px 12px; border-radius: 8px;
    background: rgba(0,0,0,0.7); color: var(--ok); opacity: 0; pointer-events: none;
  }
  .banner.show { opacity: 1; }

  .bottom-chrome {
    position: absolute; left: 10px; right: 10px;
    bottom: max(10px, env(safe-area-inset-bottom, 0px));
    z-index: 10; display: flex; flex-direction: column; gap: 6px;
  }
  .note {
    position: static; margin: 0; padding: 0 2px;
    font-size: 11px; line-height: 1.35; color: rgba(232,215,195,0.55); text-align: center;
  }
  .dock-tools {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  }
  .dock-main {
    display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px;
  }
  .bottom-chrome button {
    border: 0; border-radius: 10px; padding: 11px 6px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .dock-tools button { padding: 9px 4px; font-size: 12px; }
  .ghost { background: rgba(255,255,255,0.08); color: var(--ok); }
  .primary { background: var(--red); color: #fff; }
  .strike-btn { background: #2a6f8f; color: #fff; }
  .strike-btn:disabled, .strike-btn.hidden { opacity: 0.35; }
  .strike-btn.hidden { visibility: hidden; }
  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.62);
    display: none; align-items: center; justify-content: center; z-index: 20; padding: 24px;
  }
  .overlay.show { display: flex; }
  .card {
    width: 100%; max-width: 300px; background: #1c1612; border-radius: 16px;
    padding: 20px; border: 1px solid rgba(196,60,46,0.4); text-align: center;
  }
  .card h2 { font-size: 20px; margin-bottom: 8px; }
  .card p { font-size: 13px; color: rgba(232,215,195,0.75); line-height: 1.5; margin-bottom: 16px; }
  .card button { width: 100%; border: 0; border-radius: 10px; padding: 12px; background: var(--red); color: #fff; font-weight: 600; margin-top: 8px; }
  .hold-track {
    margin-top: 6px; height: 8px; border-radius: 99px;
    background: rgba(255,255,255,0.1); overflow: hidden;
    display: none;
  }
  .hold-track.show { display: block; }
  .hold-bar {
    height: 100%; width: 0%; border-radius: 99px;
    transition: width 0.05s linear;
  }
  .hold-bar.punch { background: linear-gradient(90deg, #e85a2a, #ffb080); }
  .hold-bar.bong { background: linear-gradient(90deg, #3aa0c8, #9ad8ef); }
  .hold-meta {
    margin-top: 3px; font-size: 10px; color: rgba(232,215,195,0.75);
    display: none;
  }
  .hold-meta.show { display: block; }

  .hand-overlay {
    position: absolute;
    left: 0;
    right: 0;
    height: 30%;
    bottom: calc(148px + env(safe-area-inset-bottom, 0px));
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .hand-overlay canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .hand-tag {
    position: absolute;
    left: 12px;
    right: auto;
    top: auto;
    bottom: calc(156px + env(safe-area-inset-bottom, 0px));
    width: max-content;
    max-width: 42%;
    z-index: 7;
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #f3ebe0;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85);
    pointer-events: none;
  }
  .hand-tag.cun { color: #ffd78a; }
  .hand-tag.need { color: #ffb089; }
  .hand-tag.lost { color: rgba(232,215,195,0.78); }

  @media (orientation: landscape) and (min-width: 1000px) {
    html, body { height: 100%; overflow: hidden; }
    .phone {
      max-width: none; width: 100%; margin: 0;
      height: 100dvh; min-height: 0; overflow: hidden;
      display: grid;
      grid-template-columns: clamp(180px, 20vw, 340px) minmax(0, 1fr) clamp(220px, 22vw, 360px);
      grid-template-rows: minmax(0, 1fr);
      grid-template-areas: "side stage rail";
      --pole-x: 50%;
      background:
        radial-gradient(ellipse at 50% 42%, #5a4030 0%, transparent 48%),
        linear-gradient(180deg, #2a1c14 0%, #12100e 55%, #0a0908 100%);
    }
    .side-left {
      grid-area: side;
      display: flex; flex-direction: column;
      gap: clamp(8px, 1.4vh, 16px);
      min-width: 0; min-height: 0; height: 100%;
      padding: clamp(8px, 1.2vh, 14px);
      padding-left: max(8px, env(safe-area-inset-left));
      overflow: hidden; z-index: 8;
      background: rgba(8, 6, 5, 0.55);
      border-right: 1px solid rgba(232, 215, 195, 0.14);
    }
    .stage-col {
      grid-area: stage;
      display: block; position: relative; min-width: 0; min-height: 0; height: 100%;
      overflow: hidden;
    }
    .rail {
      grid-area: rail;
      display: flex; flex-direction: column;
      gap: clamp(6px, 1vh, 12px);
      min-width: 0; min-height: 0; height: 100%; position: relative;
      padding: clamp(8px, 1.2vh, 14px);
      padding-right: max(8px, env(safe-area-inset-right));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      overflow: hidden; z-index: 8;
      background: rgba(8, 6, 5, 0.55);
      border-left: 1px solid rgba(232, 215, 195, 0.14);
    }
    .overlay { grid-area: 1 / 1 / -1 / -1; }
    .cam-wrap {
      position: relative; left: auto; top: auto; right: auto; bottom: auto;
      width: 100%; height: auto; aspect-ratio: 4 / 3;
      flex: 0 0 auto; z-index: 1;
    }
    .cam-status { font-size: clamp(10px, 1.3vh, 13px); }
    .topbar {
      position: static; left: auto; right: auto; top: auto;
      letter-spacing: 0.12em; font-size: clamp(11px, 1.4vh, 14px);
    }
    .hud {
      position: static; top: auto; right: auto; left: auto; z-index: auto;
      padding: clamp(8px, 1.1vh, 14px);
      grid-template-columns: clamp(40px, 8vh, 72px) minmax(0, 1fr);
      gap: clamp(4px, 0.7vh, 8px); align-items: center;
      flex: 0 1 auto; min-height: 0;
    }
    .hud-main { display: contents; }
    .timer-wrap {
      width: clamp(40px, 8vh, 72px); height: clamp(40px, 8vh, 72px);
      grid-column: 1; grid-row: 2;
    }
    .timer-wrap svg { width: 100%; height: 100%; }
    .timer-wrap .t { font-size: clamp(13px, 2vh, 20px); }
    .step-tag { grid-column: 1 / -1; grid-row: 1; font-size: clamp(14px, 2.4vh, 26px); line-height: 1.25; }
    .count { grid-column: 2; grid-row: 2; font-size: clamp(12px, 1.7vh, 18px); margin-top: 0; }
    .instr { grid-column: 1 / -1; grid-row: 3; font-size: clamp(11px, 1.7vh, 16px); line-height: 1.35; }
    .hold-track { grid-column: 1 / -1; grid-row: 4; }
    .hold-meta { grid-column: 1 / -1; grid-row: 5; }
    .seq { grid-column: 1 / -1; grid-row: 6; margin-top: clamp(4px, 0.6vh, 8px); }
    .seq span {
      width: clamp(16px, 2.6vh, 28px); height: clamp(16px, 2.6vh, 28px);
      border-radius: 4px; font-size: clamp(9px, 1.4vh, 13px);
    }
    .dummy {
      left: calc(var(--pole-x) - var(--dummy-w) / 2);
      top: calc(50% - var(--dummy-h) / 2);
      width: var(--dummy-w); height: var(--dummy-h);
      transform: none; z-index: 4;
    }
    .arm-side {
      display: block; position: absolute; z-index: 6; overflow: visible; pointer-events: none;
      left: calc(var(--pole-x) - var(--dummy-w) / 2);
      top: calc(50% - var(--dummy-h) / 2);
      width: var(--dummy-w); height: var(--dummy-h);
    }
    .pole { width: 9%; margin-left: 0; transform: translateX(-50%); z-index: 3; }
    .arm.lu {
      left: auto; right: 50%; width: 32%; height: 5.6%;
      transform-origin: right center;
    }
    .arm.ru {
      left: 50%; width: 32%; height: 5.6%;
      transform-origin: left center;
    }
    .arm.mid {
      left: 50%; width: 32%; height: 6.2%;
      transform-origin: left center;
    }
    .leg {
      left: 50%; width: 5%; height: 22%;
      transform: rotate(-18deg);
      transform-origin: top left;
    }
    .arm.target-punch, .arm.target-bong { outline-width: 4px; }
    .demo-card {
      position: relative; left: auto; right: auto; top: auto; bottom: auto;
      flex: 1 1 auto; min-height: 0;
      width: 100%; max-width: none; z-index: auto; box-shadow: none;
      display: flex; flex-direction: column; overflow: hidden;
      padding: clamp(6px, 1vh, 12px);
    }
    .demo-label { font-size: clamp(10px, 1.4vh, 14px); }
    .demo-cmd { font-size: clamp(13px, 1.9vh, 20px); }
    .demo-hint { font-size: clamp(10px, 1.5vh, 15px); }
    .sil { flex: 1 1 auto; height: auto; min-height: 0; margin: 0; }
    .sfx {
      left: 0; top: 22%; transform: translate(-108%, -50%);
      font-size: clamp(18px, 3vmin, 28px); z-index: 2;
    }
    .sfx.show { animation: popWide 0.4s ease forwards; }
    .flash { z-index: 5; }
    .banner {
      top: 8px; transform: translateX(-50%);
      max-width: min(52%, calc(100% - 24px)); z-index: 7;
      font-size: clamp(13px, 2vh, 18px);
    }
    .note { font-size: clamp(11px, 1.5vh, 15px); }
    .bottom-chrome {
      position: static; left: auto; right: auto; bottom: auto;
      margin-top: auto; z-index: auto;
      gap: clamp(6px, 0.8vh, 10px);
    }
    .dock-tools { grid-template-columns: 1fr; }
    .dock-main { grid-template-columns: 1fr; gap: clamp(6px, 0.8vh, 10px); }
    .bottom-chrome button {
      padding: clamp(8px, 1.35vh, 16px) 8px;
      font-size: clamp(12px, 1.7vh, 17px);
    }
    .dock-tools button { padding: clamp(7px, 1.15vh, 13px) 6px; }
    .hand-overlay {
      top: 0; right: 0; bottom: 0; left: 0;
      width: auto; height: auto; z-index: 1;
    }
    .hand-tag, .hand-tag.need, .hand-tag.lost {
      position: absolute;
      left: 12px;
      right: auto;
      top: 8px;
      bottom: auto;
      width: max-content;
      max-width: 42%;
      text-align: left;
      font-size: clamp(13px, 2vh, 18px);
      z-index: 7;
    }
  }
  @keyframes popWide {
    0% { opacity: 0; transform: translate(-108%, -28%) scale(0.85); }

<script type="module">
import {
  captureTipAudience,
  composeCaptureTip,
  releaseDebugCaptureTip,
  showCaptureTipText,
} from "./capture-tip.mjs";

let PoseLandmarker = null;
let HandLandmarker = null;
let FilesetResolver = null;

async function loadVisionLib() {
  const errors = [];
  const candidates = [
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm",
    "https://unpkg.com/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs",
    new URL("./mediapipe/tasks-vision.js", import.meta.url).href,
  ];
  for (const url of candidates) {
    try {
      const m = await import(url);
      PoseLandmarker = m.PoseLandmarker;
      HandLandmarker = m.HandLandmarker || null;
      FilesetResolver = m.FilesetResolver;
      return url.includes("./mediapipe/") ? "local" : url;
    } catch (e) {
      errors.push((url.includes("./mediapipe/") ? "local" : url) + ": " + (e && e.message ? e.message : e));
    }
  }
  throw new Error("姿态库脚本加载失败 → " + errors.join(" | "));
}

const P = "yat_ji_chung_kuen";
const B = "bong_sau";
// 锁定谱：冲-膀-冲-冲-膀-冲-膀-冲-冲-膀
const SEQ = [P, B, P, P, B, P, B, P, P, B];
const TIME_LIMIT = 60;
const POST_HIT_COOLDOWN = 2000; // 有效击后冷却 2s
const HOLD_PASS_MS = 3000; // 对谱形连续维持 3s 过关（与瞬时 ok 双路径）
const HOLD_FRAMES = 5; // legacy unused
const WRONG_COOLDOWN = 800;

const MOVES = {
  yat_ji_chung_kuen: {
    name: "日字冲拳", short: "冲", shape: "straight", partLabel: "右上",
    armId: "armRU", ok: "笃", bad: "嗒", sil: "punch", targetClass: "target-punch",
    cmd: "左手斜上冲出", demo: "左手斜上冲出即过 · 右上", side: "L",
  },
  bong_sau: {
    name: "膀手", short: "膀", shape: "bridge", partLabel: "中桩",
    armId: "armMid", ok: "沙—笃", bad: "嗒", sil: "bong", targetClass: "target-bong",
    cmd: "右手斜下成式", demo: "右手斜下成式即过 · 中桩", side: "R",
  },
};

let mode = "drill"; // drill | contest
let step = 0;
let running = false;
let left = TIME_LIMIT;
let endAt = 0;
let paused = false;
let posePaused = false;
let handGatePaused = false;
let pauseAnchor = 0;
let awaitBoth = false;
let handFollow = false;
let raf = 0;
let lastHitAt = 0;
let lastWrongAt = 0;
let holdShape = null;
let holdCount = 0;
let holdAccum = 0;
let holdLastTs = 0;
let camReady = false;
let poseLandmarker = null;
let poseLoading = null;
let handLandmarker = null;
let handFailed = false;
let handLoading = null;
let handToken = 0;
let visionSession = null;
let lastVideoTime = -1;
let lastSyncTs = -1;
let stream = null;
let lostStreak = 0;
const LOST_FRAMES = 14; // ~0.2s+ before soft-pause; cuts false「回到框内」

const $ = (id) => document.getElementById(id);

function debugFromLocation() {
  const value = new URLSearchParams(location.search).get("debug");
  if (value == null) return false;
  return value === "" || value === "1" || value === "true";
}

let debugMode = debugFromLocation();

function setCamStatus(text) {
  $("camStatus").textContent = showCaptureTipText(text, debugMode);
}

function setCamStatusPair(playerText, debugText) {
  $("camStatus").textContent = composeCaptureTip(playerText, debugText, debugMode);
}

function setDebugMode(on) {
  debugMode = !!on;
  const el = $("camStatus");
  if (!debugMode) el.textContent = releaseDebugCaptureTip(el.textContent);
  showBanner(debugMode ? "调试提示：开" : "调试提示：关", 800);
}

const circum = 2 * Math.PI * 28;
const requiredId = () => SEQ[step];
const required = () => MOVES[requiredId()];

function angleDeg(a, b, c) {
  const ba = { x: a.x - b.x, y: a.y - b.y };
  const bc = { x: c.x - b.x, y: c.y - b.y };
  const dot = ba.x * bc.x + ba.y * bc.y;
  const m = Math.hypot(ba.x, ba.y) * Math.hypot(bc.x, bc.y) || 1e-6;
  return Math.acos(Math.min(1, Math.max(-1, dot / m))) * 180 / Math.PI;
}

function armOf(lm, side) {
  if (side === "L") return { sh: lm[11], el: lm[13], wr: lm[15], side: "L" };
  return { sh: lm[12], el: lm[14], wr: lm[16], side: "R" };
}

function armVisible(arm) {
  if (!arm || !arm.sh || !arm.el || !arm.wr) return false;
  const vis = Math.min(arm.sh.visibility ?? 1, arm.el.visibility ?? 1, arm.wr.visibility ?? 1);
  return vis >= 0.4;
}

function inFrame(lm, arm) {
  // Soft margins — only shoulders+elbow must stay in; wrist tip may clip
  const core = [lm[11], lm[12], arm.sh, arm.el].filter(Boolean);
  const soft = [arm.wr].filter(Boolean);
  const coreOk = core.every((p) => p.x > 0.01 && p.x < 0.99 && p.y > 0.01 && p.y < 0.99);
  const softOk = soft.every((p) => p.x > -0.05 && p.x < 1.05 && p.y > -0.08 && p.y < 1.05);
  return coreOk && softOk;
}

/** 单臂 up／down 分；冲看 up，膀看 down（画面 y 向下） */
function armScores(arm) {
  const { sh, el, wr } = arm;
  const reach = Math.hypot(wr.x - sh.x, wr.y - sh.y);
  const foreshort = Math.abs((wr.z ?? 0) - (sh.z ?? 0));
  const dy = wr.y - sh.y;
  const dx = Math.abs(wr.x - sh.x);
  const wristAboveElbow = wr.y < el.y - 0.01;
  const wristBelowElbow = wr.y > el.y + 0.01;
  const MIN_REACH = 0.10;
  const MIN_EXT = Math.max(reach, foreshort * 1.2);
  if (MIN_EXT < MIN_REACH && dx < 0.06) {
    return { upScore: -1, downScore: -1, dy, reach, foreshort, weak: "未出招" };
  }
  let upScore = -1;
  if (dy < -0.02 || (wristAboveElbow && dy < 0.04)) {
    upScore =
      Math.max(0, -dy) / 0.18 +
      Math.min(0.5, reach / 0.28) +
      Math.min(0.35, foreshort * 2.5) +
      (wristAboveElbow ? 0.25 : 0);
  }
  let downScore = -1;
  if (dy > 0.02 || (wristBelowElbow && dy > -0.04)) {
    downScore =
      Math.max(0, dy) / 0.18 +
      Math.min(0.5, reach / 0.28) +
      Math.min(0.35, foreshort * 2.5) +
      (wristBelowElbow ? 0.25 : 0);
  }
  return { upScore, downScore, dy, reach, foreshort, weak: null };
}

function scoreToCandidate(shape, side, score, dy) {
  const conf = Math.min(0.98, 0.52 + score * 0.22);
  return {
    shape,
    side,
    quality: conf >= 0.58 ? "ok" : "near",
    confidence: conf,
    detail: (shape === "straight" ? "冲↑" : "膀↓") + ` dy=${dy.toFixed(2)}`,
  };
}

function classifyArm(lm, arm, spec) {
  if (!inFrame(lm, arm)) return { detail: spec.label + "出画" };
  const s = armScores(arm);
  if (s.weak) return { detail: s.weak };
  if (s.upScore < 0.2 && s.downScore < 0.2) return { detail: spec.label + "方向不明" };
  if (s.upScore > 0 && s.downScore > 0 && Math.abs(s.upScore - s.downScore) < 0.12) {
    return { detail: spec.label + "上下接近" };
  }
  const primary = spec.score === "up" ? s.upScore : s.downScore;
  const other = spec.score === "up" ? s.downScore : s.upScore;
  const wins = spec.score === "up" ? primary >= other : primary > other;
  if (wins && primary >= 0.28) {
    return { candidate: scoreToCandidate(spec.shape, spec.side, primary, s.dy) };
  }
  return { detail: spec.label + "弱特征" };
}

/** 左臂只判冲，右臂只判膀；带 side 供手模与小窗 */
function classifyPose(lm) {
  const left = armOf(lm, "L");
  const right = armOf(lm, "R");
  const leftOk = armVisible(left);
  const rightOk = armVisible(right);
  if (!leftOk && !rightOk) {
    return { shape: "unknown", quality: "lost", confidence: 0, detail: "无人", side: null };
  }

  let straight = null;
  let bridge = null;
  let nearDetail = null;
  if (leftOk) {
    const found = classifyArm(lm, left, { side: "L", shape: "straight", score: "up", label: "左臂" });
    straight = found.candidate || null;
    nearDetail = nearDetail || found.detail || null;
  }
  if (rightOk) {
    const found = classifyArm(lm, right, { side: "R", shape: "bridge", score: "down", label: "右臂" });
    bridge = found.candidate || null;
    nearDetail = nearDetail || found.detail || null;
  }

  const needShape = running && step < SEQ.length ? required().shape : null;
  if (needShape === "straight" && straight) return straight;
  if (needShape === "bridge" && bridge) return bridge;
  if (straight && !bridge) return straight;
  if (bridge && !straight) return bridge;
  if (straight && bridge) {
    return straight.confidence >= bridge.confidence ? straight : bridge;
  }
  if (!leftOk && !rightOk) {
    return { shape: "unknown", quality: "lost", confidence: 0, detail: "无人", side: null };
  }
  if (leftOk && !inFrame(lm, left) && rightOk && !inFrame(lm, right)) {
    return { shape: "unknown", quality: "lost", confidence: 0, detail: "出画", side: null };
  }
  return {
    shape: "unknown",
    quality: "near",
    confidence: 0.2,
    detail: nearDetail || "弱特征",
    side: null,
  };
}

function buildSeqUI() {
  const box = $("seq");
  box.innerHTML = "";
  SEQ.forEach((id, i) => {
    const sp = document.createElement("span");
    const mv = MOVES[id];
    sp.textContent = mv.short;
    sp.className = mv.sil + (i < step ? " done" : "") + (i === step ? " cur" : "");
    box.appendChild(sp);
  });
}

function applyStepVisual() {
  if (step >= SEQ.length) return;
  const cur = required();
  $("armRU").className = "arm ru";
  $("armMid").className = "arm mid";
  $(cur.armId).classList.add(cur.targetClass);
  $("sil").className = "sil " + cur.sil;
  if ($("demoCmd")) $("demoCmd").textContent = cur.cmd || cur.short;
  if ($("demoHint")) $("demoHint").textContent = cur.demo || (cur.short + " · " + cur.partLabel);
  $("stepTag").textContent = `第 ${step + 1}/10 击 · ${cur.name}（${cur.partLabel}）`;
  $("stepTag").className = "step-tag " + cur.sil;
  $("btnStrike").textContent = "触控演示 · " + cur.name;
  buildSeqUI();
}

function setModeUI() {
  const c = mode === "contest";
  $("topbar").textContent = c ? "咏春比赛专用" : "";
  $("topbar").classList.toggle("contest", c);
  $("btnMode").textContent = c ? "比赛" : "日课";
  $("btnStrike").classList.toggle("hidden", c);
  if (c) $("btnStrike").disabled = true;
  else if (running) $("btnStrike").disabled = false;
}

function showBanner(text, ms = 900) {
  const b = $("banner");
  b.textContent = text;
  b.classList.add("show");
  clearTimeout(showBanner._t);
  showBanner._t = setTimeout(() => b.classList.remove("show"), ms);
}

function pauseActive() {
  return posePaused || handGatePaused;
}

function notePauseEdge(was) {
  const nowOn = pauseActive();
  if (nowOn && !was) pauseAnchor = performance.now();
  if (!nowOn && was && running) endAt += performance.now() - pauseAnchor;
  paused = nowOn;
}

function setPaused(on) {
  if (on === posePaused) return;
  const was = pauseActive();
  posePaused = on;
  if (on) {
    $("camWrap").classList.add("lost");
    showBanner("回到框内", 1200);
  } else if (!handGatePaused) {
    $("camWrap").classList.remove("lost");
  }
  notePauseEdge(was);
}

function setHandGatePause(on) {
  if (on === handGatePaused) return;
  const was = pauseActive();
  handGatePaused = on;
  if (!on && !posePaused) $("camWrap").classList.remove("lost");
  notePauseEdge(was);
  if (on) {
    holdShape = null;
    holdCount = 0;
    holdAccum = 0;
    holdLastTs = 0;
    setHoldUI(false);
  }
}

function resetIdle() {
  step = 0; left = TIME_LIMIT; running = false; lastHitAt = 0; lastWrongAt = 0;
  holdShape = null; holdCount = 0; holdAccum = 0; holdLastTs = 0;
  posePaused = false; handGatePaused = false; paused = false;
  awaitBoth = false; handFollow = false;
  if (typeof handViewState !== "undefined" && handViewState.reset) handViewState.reset();
  setHoldUI(false);
  $("count").textContent = "0 / 10 · 识别：—";
  $("timerText").textContent = Math.ceil(left);
  $("ring").style.strokeDashoffset = "0";
  $("hud").classList.remove("urgent");
  $("overlay").classList.remove("show");
  $("btnStrike").disabled = mode === "contest";
  $("instr").textContent = "交错击桩 · 听指示换招。1 分钟内按序有效击 10 次；维持 3 秒或瞬时有效均可过；击后冷却 2 秒。";
  $("note").textContent = camReady
    ? "点开始；双手入镜后开课。无摄像头可按 F/J 调试。"
    : "日课可直接开始（无摄像头按 F/J 调试）；开摄像头后须双手入镜。";
  cancelAnimationFrame(raf);
  $("camWrap").classList.remove("lost");
  applyStepVisual();
  setModeUI();
}

function tick() {
  if (!running) return;
  if (!paused) {
    left = Math.max(0, (endAt - performance.now()) / 1000);
  }
  $("timerText").textContent = Math.ceil(left);
  $("ring").style.strokeDashoffset = String(circum * (1 - left / TIME_LIMIT));
  $("hud").classList.toggle("urgent", left > 0 && left <= 3);
  if (left <= 0) return finish(false);
  raf = requestAnimationFrame(tick);
}

function secureHint() {
  if (!window.isSecureContext) {
    return "当前不是安全上下文（file:// 常被拦）。请用 localhost 或 HTTPS 打开后再点「开启摄像头」。";
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return "当前浏览器无法调摄像头。请用 Safari／Chrome，并用 HTTPS 或 localhost 打开（勿用 file://）。";
  }
  return "";
}

async function ensureCamera() {
  if (stream) return true;
  const hint = secureHint();
  if (hint) {
    camReady = false;
    setCamStatus("需 HTTPS／localhost");
    showBanner("请用本机服务打开", 2200);
    $("note").textContent = hint;
    return false;
  }
  try {
    setCamStatus("申请权限…");
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      });
    } catch (e1) {
      // Safari 常对 ideal 尺寸更严，降级再试
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: "user" } },
      });
    }
    const video = $("video");
    video.srcObject = stream;
    await video.play();
    camReady = true;
    setCamStatus("识别中…");
    $("overlay").classList.remove("show");
    $("note").textContent = "点开始；双手入镜后开课。无摄像头可按 F/J 调试。";
    if (!handLandmarker) handFailed = false;
    return true;
  } catch (err) {
    camReady = false;
    setCamStatus("权限失败／待开启");
    showBanner("请允许摄像头后点「开启摄像头」", 2200);
    $("note").textContent = "摄像头未授权；日课可直接开始，按 F/J 或触控演示调试。错误：" + (err && err.name ? err.name : "unknown");
    return false;
  }
}

async function initPose() {
  if (poseLandmarker) {
    if (!handLandmarker && !handFailed && visionSession) kickHand(visionSession.vision, visionSession.delegate);
    return poseLandmarker;
  }
  if (poseLoading) return poseLoading;
  setCamStatus("加载识别模型…");
  $("note").textContent = "正在加载姿态模型（可先用触控演示开课）…";
  poseLoading = (async () => {
    if (!PoseLandmarker) {
      const src = await loadVisionLib();
      console.log("vision lib", src);
    }
    const wasmCandidates = [
      new URL("./mediapipe", import.meta.url).href,
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm",
      "https://unpkg.com/@mediapipe/tasks-vision@0.10.18/wasm",
    ];
    const modelCandidates = [
      new URL("./mediapipe/pose_landmarker_lite.task", import.meta.url).href,
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
    ];
    let lastErr = null;
    for (const wasm of wasmCandidates) {
      let vision;
      try {
        vision = await FilesetResolver.forVisionTasks(wasm);
      } catch (e) {
        lastErr = e;
        console.warn("wasm fail", wasm, e);
        continue;
      }
      for (const model of modelCandidates) {
        for (const delegate of ["CPU", "GPU"]) {
          try {
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
              baseOptions: { modelAssetPath: model, delegate },
              runningMode: "VIDEO",
              numPoses: 1,
            });
            console.log("pose ok", { wasm, model, delegate });
            visionSession = { vision, delegate };
            setCamStatus(camReady ? "识别待命" : "模型就绪·请开摄像头");
            if (!running) $("note").textContent = "姿态已就绪，正在加载手模。日课与触控演示可用。";
            kickHand(vision, delegate);
            return poseLandmarker;
          } catch (e) {
            lastErr = e;
            console.warn("model fail", model, delegate, e);
          }
        }
      }
    }
    const msg = (lastErr && (lastErr.message || String(lastErr))) || "未知错误";
    setCamStatus("模型失败");
    $("note").textContent = "姿态模型加载失败：" + msg + "。请用本机服务打开并保留 mediapipe 文件夹；日课仍可用触控演示。";
    poseLoading = null;
    throw lastErr || new Error(msg);
  })();
  return poseLoading;
}

const PRESENT_MISS_GRACE_MS = 160;
const PUSH_SMOOTH_MS = 90;
const PULSE_PUSH_MS = 180;
const PULSE_HOLD_MS = 150;
const PULSE_RECOVER_MS = 250;

function nextSyncTs(now) {
  const ts = now <= lastSyncTs ? lastSyncTs + 0.001 : now;
  lastSyncTs = ts;
  return ts;
}

function shapeToPresent(shape) {
  if (shape === "straight") return "punch_drive";
  if (shape === "bridge") return "bong_bridge";
  return "guard";
}

const skinImg = { Left: new Image(), Right: new Image() };
const skinAnchorU = { Left: 0.5, Right: 0.5 };
skinImg.Left.src = new URL("./hand-skin-L.png", import.meta.url).href;
skinImg.Right.src = new URL("./hand-skin-R.png", import.meta.url).href;

function measureWristU(img) {
  const w = img.naturalWidth;
  const h = img.naturalHeight;
  if (!w || !h) return 0.5;
  const sample = document.createElement("canvas");
  sample.width = w;
  sample.height = h;
  const sctx = sample.getContext("2d", { willReadFrequently: true });
  sctx.drawImage(img, 0, 0);
  const data = sctx.getImageData(0, 0, w, h).data;
  const y0 = Math.floor(h * 0.72);
  const y1 = Math.min(h, Math.floor(h * 0.84));
  let sum = 0;
  let n = 0;
  for (let y = y0; y < y1; y++) {
    for (let x = 0; x < w; x++) {
      if (data[(y * w + x) * 4 + 3] < 24) continue;
      sum += x + 0.5;
      n += 1;
    }
  }
  return n ? sum / n / w : 0.5;
}

function bindWristU(img, side) {
  const read = () => { skinAnchorU[side] = measureWristU(img); };
  if (img.complete && img.naturalWidth) read();
  else img.addEventListener("load", read, { once: true });
}
bindWristU(skinImg.Left, "Left");
bindWristU(skinImg.Right, "Right");

function splitHands(packets) {
  const list = packets || [];
  const ranked = [];
  for (let i = 0; i < list.length; i++) {
    const item = list[i];
    if (!item || !item.lm || !item.lm[0] || item.lm[0].x == null) continue;
    ranked.push(item);
  }
  ranked.sort((a, b) => (b.score || 0) - (a.score || 0));
  const top = ranked.slice(0, 2);
  let left = null;
  let right = null;
  if (top.length >= 2) {
    top.sort((a, b) => a.lm[0].x - b.lm[0].x);
    // Unmirrored selfie frame: smaller x is the person's right hand.
    right = { lm: top[0].lm, side: "Right", score: top[0].score || 0 };
    left = { lm: top[1].lm, side: "Left", score: top[1].score || 0 };
  } else if (top.length === 1) {
    const item = top[0];
    if (item.side === "Left") left = item;
    else right = item;
  }
  let presence = "need_both";
  if (left && right) presence = "both";
  else if (left) presence = "miss_right";
  else if (right) presence = "miss_left";
  return { presence, left, right };
}

function handGateLabel(action, presence, seenBoth, promptBoth) {
  if (presence === "miss_left" || presence === "miss_right") return "请双手入镜";
  if (presence === "need_both" && (promptBoth || seenBoth)) {
    if (seenBoth && action === "lost") return "手模丢失，回到框内";
    return "请双手入镜";
  }
  if (action === "lost" && seenBoth) return "手模丢失，回到框内";
  return "";
}

const LANDSCAPE_MQ = "(orientation: landscape) and (min-width: 1000px)";
const HAND_H_LAND = 0.47;
const HAND_H_PORT = 0.9;
let stagePoleFrac = 0.5;
let stageReachFrac = 0.18;

function syncStageGeom() {
  const stage = document.querySelector(".stage");
  if (!stage) return;
  const sr = stage.getBoundingClientRect();
  const raw = getComputedStyle(stage).getPropertyValue("--pole-x").trim();
  const pole = stage.querySelector(".pole");
  if (raw.endsWith("%")) stagePoleFrac = parseFloat(raw) / 100;
  else if (pole && sr.width > 1) {
    const pr = pole.getBoundingClientRect();
    stagePoleFrac = (pr.left + pr.width / 2 - sr.left) / sr.width;
  }
  if (sr.width < 2) return;
  const mid = sr.left + sr.width * stagePoleFrac;
  let reach = 0;
  stage.querySelectorAll(".pole, .arm, .leg").forEach((el) => {
    const r = el.getBoundingClientRect();
    reach = Math.max(reach, mid - r.left, r.right - mid);
  });
  stageReachFrac = reach / sr.width;
}

function handExtents(dw, dh, u, tilt) {
  const c = Math.cos(tilt);
  const s = Math.sin(tilt);
  let minX = 0;
  let maxX = 0;
  const pts = [
    [-dw * u, -dh * 0.78],
    [dw * (1 - u), -dh * 0.78],
    [-dw * u, dh * 0.22],
    [dw * (1 - u), dh * 0.22],
  ];
  for (let i = 0; i < pts.length; i++) {
    const xr = pts[i][0] * c - pts[i][1] * s;
    if (xr < minX) minX = xr;
    if (xr > maxX) maxX = xr;
  }
  return { minX, maxX };
}

/** 固定车道：左手在杆左、右手在杆右；push 0 护手、1 前推并缩小约 15% */
function laneHand(side, push, w, h) {
  const p = Math.min(1, Math.max(0, push));
  const landscape = window.matchMedia(LANDSCAPE_MQ).matches;
  const pole = w * stagePoleFrac;
  const tilt = side === "Left" ? 0.18 : -0.18;
  const scale = 1 - 0.15 * p;
  const frac = landscape ? HAND_H_LAND : HAND_H_PORT;
  const dh = h * frac * scale;
  const lift = h * 0.1 * p;
  const pad = Math.max(4, h * 0.012);
  const y = h - pad - dh * 0.22 - lift;
  const img = skinImg[side];
  const aspect = img && img.naturalWidth ? img.naturalWidth / img.naturalHeight : (side === "Left" ? 157 / 512 : 191 / 512);
  const dw = dh * aspect;
  const u = skinAnchorU[side] || 0.5;
  let x;
  if (!landscape) {
    const gap = w * (0.22 + (0.09 - 0.22) * p);
    x = side === "Left" ? pole - gap : pole + gap;
  } else {
    const ext = handExtents(dw, dh, u, tilt);
    const stage = document.querySelector(".stage");
    const cssW = stage ? stage.getBoundingClientRect().width : w;
    const dpr = cssW > 1 ? w / cssW : 1;
    const gap = Math.max(24 * dpr, w * 0.02);
    const reach = w * stageReachFrac + gap;
    const inward = gap * 0.85 * p;
    if (side === "Left") {
      x = pole - reach - ext.maxX + inward;
      const minX = gap - ext.minX;
      if (x < minX) x = minX;
    } else {
      x = pole + reach - ext.minX - inward;
      const maxX = w - gap - ext.maxX;
      if (x > maxX) x = maxX;
    }
  }
  return { x, y, tilt, side, scale, frac };
}

function fitHandFrame(host) {
  if (!host) return 0;
  if (window.matchMedia(LANDSCAPE_MQ).matches) {
    if (host.style.height) host.style.height = "";
    return host.clientHeight;
  }
  const mid = $("armMid");
  const ru = $("armRU");
  if (!mid || !ru) return 0;
  const armBottom = Math.max(mid.getBoundingClientRect().bottom, ru.getBoundingClientRect().bottom);
  const bottom = host.getBoundingClientRect().bottom;
  const room = Math.max(0, bottom - armBottom - 10);
  const stageH = host.parentElement ? host.parentElement.clientHeight : window.innerHeight;
  const len = Math.min(stageH, room);
  const px = Math.round(len);
  const next = px + "px";
  if (host.style.height !== next) host.style.height = next;
  return px;
}

function drawSkinHand(ctx, img, at, h, alpha) {
  if (!img || !img.complete || !img.naturalWidth) return false;
  const scale = at.scale == null ? 1 : at.scale;
  const frac = at.frac == null ? HAND_H_LAND : at.frac;
  const dh = h * frac * scale;
  const dw = dh * (img.naturalWidth / img.naturalHeight);
  ctx.save();
  ctx.translate(at.x, at.y);
  ctx.rotate(at.tilt || 0);
  ctx.globalAlpha = alpha;
  const u = skinAnchorU[at.side] || 0.5;
  ctx.drawImage(img, -dw * u, -dh * 0.78, dw, dh);
  ctx.restore();
  return true;
}

function createHandViewState() {
  let present = "guard";
  let presence = "idle";
  let seenBoth = false;
  let promptBoth = false;
  let tracking = false;
  let missingSince = 0;
  let hold01 = 0;
  let pushL = 0;
  let pushR = 0;
  let targetL = 0;
  let targetR = 0;
  let pulseL = null;
  let pulseR = null;
  let lastSmoothAt = 0;
  let tagSide = null;

  function pulseGoal(pulse, now) {
    if (!pulse) return null;
    const t = now - pulse.t0;
    if (t < PULSE_PUSH_MS) return Math.min(1, t / PULSE_PUSH_MS);
    if (t < PULSE_PUSH_MS + PULSE_HOLD_MS) return 1;
    const back = t - PULSE_PUSH_MS - PULSE_HOLD_MS;
    if (back >= PULSE_RECOVER_MS) return null;
    return Math.max(0, 1 - back / PULSE_RECOVER_MS);
  }

  function desiredPush(side, now) {
    const pulse = side === "L" ? pulseL : pulseR;
    const fromPulse = pulseGoal(pulse, now);
    if (fromPulse == null && pulse) {
      if (side === "L") pulseL = null;
      else pulseR = null;
    }
    if (fromPulse != null) return fromPulse;
    return side === "L" ? targetL : targetR;
  }

  function moveTagText() {
    if (tagSide === "L") return "左手 · 日字冲拳";
    if (tagSide === "R") return "右手 · 膀手";
    return "";
  }

  function shouldDrawHands() {
    if (!camReady) return true;
    if (presence === "both") return true;
    if (seenBoth && missingSince && (performance.now() - missingSince) < PRESENT_MISS_GRACE_MS) return true;
    return false;
  }

  return {
    reset() {
      present = "guard";
      presence = "idle";
      seenBoth = false;
      promptBoth = false;
      tracking = false;
      missingSince = 0;
      hold01 = 0;
      pushL = 0;
      pushR = 0;
      targetL = 0;
      targetR = 0;
      pulseL = null;
      pulseR = null;
      lastSmoothAt = 0;
      tagSide = null;
    },
    setPrompt(on) {
      promptBoth = !!on;
      if (promptBoth && presence === "idle") presence = "need_both";
    },
    pulse(side) {
      const now = performance.now();
      if (side === "L") {
        pulseL = { t0: now };
        tagSide = "L";
      } else if (side === "R") {
        pulseR = { t0: now };
        tagSide = "R";
      }
    },
    setPoseDrive(side, shape, quality) {
      const active = quality === "ok" || quality === "near";
      if (!active || !side || (shape !== "straight" && shape !== "bridge")) {
        targetL = 0;
        targetR = 0;
        if (!pulseL && !pulseR) tagSide = null;
        return;
      }
      if (side === "L" && shape === "straight") {
        targetL = 1;
        targetR = 0;
        tagSide = "L";
        present = "punch_drive";
      } else if (side === "R" && shape === "bridge") {
        targetR = 1;
        targetL = 0;
        tagSide = "R";
        present = "bong_bridge";
      } else {
        targetL = 0;
        targetR = 0;
        if (!pulseL && !pulseR) tagSide = null;
        present = "guard";
      }
    },
    sync(shape, packets, now) {
      const split = splitHands(packets);
      if (split.presence === "both") {
        const action = shapeToPresent(shape);
        seenBoth = true;
        tracking = true;
        missingSince = 0;
        presence = "both";
        present = action;
        return { presence: "both", action, holdOff: false };
      }
      if (tracking) {
        tracking = false;
        missingSince = now;
      }
      const inGrace = seenBoth && missingSince && (now - missingSince) < PRESENT_MISS_GRACE_MS;
      if (inGrace) {
        return { presence: "both", action: present, holdOff: false };
      }
      presence = split.presence;
      present = seenBoth ? "lost" : "guard";
      targetL = 0;
      targetR = 0;
      return { presence, action: present, holdOff: !!seenBoth };
    },
    onHitOk() {},
    onHoldProgress(p) {
      hold01 = p > 0 ? Math.min(1, p) : 0;
    },
    paint(ctx, w, h) {
      if (!shouldDrawHands()) {
        lastSmoothAt = 0;
        return;
      }
      const now = performance.now();
      let t = 1;
      if (lastSmoothAt) {
        const dt = now - lastSmoothAt;
        t = dt > 200 ? 1 : (dt <= 0 ? 0 : 1 - Math.exp(-dt / PUSH_SMOOTH_MS));
      }
      lastSmoothAt = now;
      const wantL = desiredPush("L", now);
      const wantR = desiredPush("R", now);
      pushL += (wantL - pushL) * t;
      pushR += (wantR - pushR) * t;
      if (Math.abs(pushL) < 0.002) pushL = 0;
      if (Math.abs(pushR) < 0.002) pushR = 0;
      const alpha = 0.94 + hold01 * 0.06;
      drawSkinHand(ctx, skinImg.Left, laneHand("Left", pushL, w, h), h, alpha);
      drawSkinHand(ctx, skinImg.Right, laneHand("Right", pushR, w, h), h, alpha);
    },
    paintStage() {
      const canvas = $("handCanvas");
      const tag = $("handTag");
      const host = $("handOverlay");
      const shown = presence === "both" ? present : (presence === "idle" || !camReady ? "guard" : presence);
      if (host) {
        host.dataset.present = shown;
        host.dataset.hands = !camReady ? "both" : presence;
      }
      if (tag) {
        const gate = camReady ? handGateLabel(present, presence, seenBoth, promptBoth) : "";
        const move = (!gate && (pushL > 0.08 || pushR > 0.08 || tagSide)) ? moveTagText() : "";
        const text = gate || move;
        const cls = "hand-tag" + (text === "请双手入镜" ? " need" : text === "手模丢失，回到框内" ? " lost" : "");
        if (tag.textContent !== text) tag.textContent = text;
        if (tag.className !== cls) tag.className = cls;
        tag.hidden = !text;
      }
      if (!canvas || !host) return;
      fitHandFrame(host);
      syncStageGeom();
      const rect = canvas.getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(rect.width * dpr));
      const hgt = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== hgt) {
        canvas.width = w;
        canvas.height = hgt;
      }
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, w, hgt);
      this.paint(ctx, w, hgt);
    },
  };
}

const handViewState = createHandViewState();

function kickHand(vision, delegate) {
  initHand(vision, delegate).then((ok) => {
    if (awaitBoth && !running) {
      setCamStatus("请双手入镜");
      $("note").textContent = ok && camReady
        ? "双手同时入镜后开课。无摄像头可按 F/J 调试。"
        : "开摄像头后须双手入镜；也可无摄像头按 F/J 调试。";
      return;
    }
    if (running) return;
    $("note").textContent = ok
      ? "姿态与手模已就绪（" + delegate + "）。日课可直接开始；开摄像头后须双手入镜。"
      : "姿态已就绪，手模未加载。日课可按 F/J 或触控演示。";
  }).catch((err) => console.warn("hand", err));
}

async function initHand(vision, preferredDelegate) {
  if (handLandmarker) return true;
  if (handFailed) return false;
  if (!HandLandmarker || !vision) {
    handFailed = true;
    return false;
  }
  if (handLoading) return handLoading;
  const token = handToken;
  const job = (async () => {
    const modelCandidates = [
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      new URL("./mediapipe/hand_landmarker.task", import.meta.url).href,
    ];
    const first = preferredDelegate === "GPU" ? "GPU" : "CPU";
    const delegates = [first, first === "CPU" ? "GPU" : "CPU"];
    let lastErr = null;
    for (const model of modelCandidates) {
      for (const delegate of delegates) {
        if (token !== handToken) return false;
        try {
          const created = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: model, delegate },
            runningMode: "VIDEO",
            numHands: 2,
          });
          if (token !== handToken) {
            if (created && created.close) {
              try { created.close(); } catch (err) { console.warn(err); }
            }
            return false;
          }
          handLandmarker = created;
          console.log("hand ok", { model, delegate });
          return true;
        } catch (e) {
          lastErr = e;
          console.warn("hand fail", model, delegate, e);
        }
      }
    }
    if (token === handToken) {
      handFailed = true;
      console.warn("hand present unavailable", lastErr);
    }
    return false;
  })();
  handLoading = job;
  try {
    return await job;
  } finally {
    if (handLoading === job) handLoading = null;
  }
}

function flash(ok) {
  const cur = required();
  $("flash").className = "flash " + (ok ? "ok" : "bad");
  if (ok) {
    $(cur.armId).classList.add("hit");
    $("demoCard").classList.add("ok-flash");
    $("sil").classList.add("strike");
  }
  const s = $("sfx");
  s.textContent = ok ? cur.ok : cur.bad;
  s.classList.remove("show");
  void s.offsetWidth;
  s.classList.add("show");
  setTimeout(() => {
    $("flash").className = "flash";
    $("armRU").classList.remove("hit");
    $("armMid").classList.remove("hit");
    $("sil").classList.remove("strike");
    $("demoCard").classList.remove("ok-flash");
  }, ok ? 200 : (cur.sil === "bong" ? 140 : 90));
}

function onHitValid(fromTouch) {
  if (handGatePaused && !fromTouch) return;
  const now = performance.now();
  if (now - lastHitAt < POST_HIT_COOLDOWN) return;
  lastHitAt = now;
  holdShape = null;
  holdCount = 0;
  holdAccum = 0;
  holdLastTs = 0;
  flash(true);
  handViewState.onHitOk();
  step += 1;
  $("count").textContent = step + " / 10 · 识别：ok";
  if (step >= 10) {
    finish(true);
    return;
  }
  applyStepVisual();
  showBanner("冷却中 · 2 秒后可下一击", 1200);
}

function onHitWrong(msg) {
  const now = performance.now();
  if (now - lastWrongAt < WRONG_COOLDOWN) return;
  lastWrongAt = now;
  flash(false);
  showBanner(msg || ("须出" + required().name), 800);
}


function setHoldUI(on, sil, sec, pct) {
  const track = $("holdTrack");
  const bar = $("holdBar");
  const meta = $("holdMeta");
  if (!track || !bar) return;
  if (!on) {
    track.classList.remove("show");
    if (meta) meta.classList.remove("show");
    bar.style.width = "0%";
    bar.style.display = "none";
    return;
  }
  track.classList.add("show");
  bar.style.display = "block";
  bar.className = "hold-bar " + (sil || "punch");
  bar.style.width = Math.max(0, Math.min(100, pct)) + "%";
  if (meta) {
    meta.classList.add("show");
    const name = sil === "bong" ? "膀态维持中" : "冲态维持中";
    meta.textContent = name + " " + sec.toFixed(1) + "/3s · " + Math.round(pct) + "%";
  }
}

function applyCandidate(c) {
  const now = performance.now();
  const label = c.shape + (c.detail ? ` ${c.detail}` : "");
  $("count").textContent = `${step} / 10 · 识别：${c.shape}/${c.quality}`;

  if (c.quality === "lost") {
    lostStreak += 1;
    holdShape = null;
    holdCount = 0;
    holdAccum = 0;
    holdLastTs = 0;
    if (lostStreak >= LOST_FRAMES) {
      if (running) setPaused(true);
      setCamStatus("回到框内");
    } else {
      setCamStatus("识别中…");
    }
    return;
  }
  lostStreak = 0;
  if (paused) setPaused(false);

  if (!running || step >= 10) {
    if (captureTipAudience(label) !== "debug" || debugMode) setCamStatus(label);
    return;
  }

  if (handGatePaused) {
    holdShape = null;
    holdCount = 0;
    holdAccum = 0;
    holdLastTs = 0;
    setHoldUI(false);
    setCamStatus("请双手入镜");
    return;
  }

  const need = required();
  const coolLeft = lastHitAt ? POST_HIT_COOLDOWN - (now - lastHitAt) : 0;
  if (coolLeft > 0) {
    setCamStatus("冷却中 " + Math.ceil(coolLeft / 1000) + "s");
    holdAccum = 0;
    holdLastTs = 0;
    holdShape = null;
    holdCount = 0;
    setHoldUI(false);
    return;
  }

  if (c.shape === "unknown") {
    if (holdAccum > 0) showBanner("保持姿势", 800);
    holdAccum = 0;
    holdLastTs = 0;
    holdShape = null;
    holdCount = 0;
    setHoldUI(false);
    setCamStatus(label);
    return;
  }

  if (c.shape !== need.shape) {
    if (holdAccum > 0) showBanner("保持姿势", 800);
    holdShape = null;
    holdCount = 0;
    holdAccum = 0;
    holdLastTs = 0;
    setHoldUI(false);
    onHitWrong("须出" + need.name);
    setCamStatus(label);
    return;
  }

  // 路径 B：ok 或 near 均可蓄 3s 维持
  if (c.quality === "ok" || c.quality === "near") {
    if (holdShape === c.shape && holdLastTs) holdAccum += now - holdLastTs;
    else { holdShape = c.shape; holdAccum = 0; }
    holdLastTs = now;
    const sec = Math.min(HOLD_PASS_MS / 1000, holdAccum / 1000);
    const pct = Math.floor((holdAccum / HOLD_PASS_MS) * 100);
    const tag = need.sil === "punch" ? "冲态维持中" : "膀态维持中";
    setHoldUI(true, need.sil, sec, pct);
    setCamStatus(tag + " " + sec.toFixed(1) + "/3s · " + pct + "%");
    $("count").textContent = `${step} / 10 · ${tag} ${pct}%`;
    if (holdAccum >= HOLD_PASS_MS) {
      setHoldUI(false);
      onHitValid();
      return;
    }
  } else {
    holdAccum = 0;
    holdLastTs = 0;
  }

  // 路径 A：瞬时 ok + 短去抖（原判定）
  if (c.quality === "ok") {
    if (holdShape === c.shape) holdCount += 1;
    else { holdCount = 1; }
    if (holdCount >= HOLD_FRAMES) {
      setHoldUI(false);
      onHitValid();
      return;
    }
  }

  if (c.quality === "near" && holdAccum <= 0) {
    showBanner("再送一寸", 500);
  }
}


function poseTooLow(lm) {
  const dropped = (p) => !p || (typeof p.visibility === "number" && p.visibility < 0.5) || p.y > 0.8;
  return dropped(lm && lm[11]) && dropped(lm && lm[12]);
}

function predictLoop() {
  try {
    const video = $("video");
    if (poseLandmarker && camReady && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const syncTs = nextSyncTs(performance.now());
      const result = poseLandmarker.detectForVideo(video, syncTs);
      let handPoints = null;
      if (handLandmarker) {
        try {
          const handResult = handLandmarker.detectForVideo(video, syncTs);
          const marks = (handResult && handResult.landmarks) || [];
          const handed = (handResult && handResult.handedness) || [];
          handPoints = marks.map((lm, i) => {
            const cat = handed[i] && handed[i][0];
            const name = cat && (cat.categoryName || cat.displayName || "");
            return {
              lm,
              side: name === "Left" || name === "Right" ? name : "",
              score: cat && cat.score ? cat.score : 0,
            };
          });
        } catch (err) {
          console.warn("hand frame", err);
          handPoints = [];
        }
      }
      const lm = result && result.landmarks && result.landmarks[0];
      const candidate = lm
        ? classifyPose(lm)
        : { shape: "unknown", quality: "lost", confidence: 0, detail: "无人" };
      if (handPoints) {
        const view = handViewState.sync(candidate.shape, handPoints, syncTs);
        if (awaitBoth && !running && view.presence === "both") {
          awaitBoth = false;
          handFollow = true;
          beginRound();
        }
        if (handFollow && running) setHandGatePause(!!view.holdOff);
      }
      if (camReady && running && !handGatePaused) {
        handViewState.setPoseDrive(candidate.side, candidate.shape, candidate.quality);
      } else if (camReady) {
        handViewState.setPoseDrive(null, null, null);
      }
      if (lm || running) applyCandidate(candidate);
      if (awaitBoth || handGatePaused) {
        let seen = 0;
        if (handPoints) {
          for (let i = 0; i < handPoints.length; i++) {
            const wpt = handPoints[i] && handPoints[i].lm && handPoints[i].lm[0];
            if (wpt && wpt.x != null) seen += 1;
          }
        }
        const low = !!(handPoints && result && poseTooLow(result.landmarks && result.landmarks[0]));
        const player = low
          ? "请双手入镜 · 人偏下：屏幕前倾或坐远一点"
          : "请双手入镜";
        const poseLabel = candidate.shape + (candidate.detail ? " " + candidate.detail : "");
        const debugBits = [];
        if (handPoints) debugBits.push("检出 " + seen + "/2 只手");
        if (captureTipAudience(poseLabel) === "debug") debugBits.push(poseLabel);
        setCamStatusPair(player, debugBits.join(" · "));
      }
      handViewState.onHoldProgress(running && holdAccum > 0 ? holdAccum / HOLD_PASS_MS : 0);

      const canvas = $("overlayCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (lm && candidate.side) {
        const arm = armOf(lm, candidate.side);
        if (armVisible(arm)) {
          ctx.fillStyle = "rgba(232,215,195,0.85)";
          for (const p of [arm.sh, arm.el, arm.wr]) {
            ctx.beginPath();
            ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.strokeStyle = "rgba(232,90,42,0.7)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(arm.sh.x * canvas.width, arm.sh.y * canvas.height);
          ctx.lineTo(arm.el.x * canvas.width, arm.el.y * canvas.height);
          ctx.lineTo(arm.wr.x * canvas.width, arm.wr.y * canvas.height);
          ctx.stroke();
        }
      }
      if (handPoints) {
        ctx.fillStyle = "#3aa0c8";
        for (let i = 0; i < handPoints.length; i++) {
          const wpt = handPoints[i] && handPoints[i].lm && handPoints[i].lm[0];
          if (!wpt || wpt.x == null || wpt.y == null) continue;
          ctx.beginPath();
          ctx.arc(wpt.x * canvas.width, wpt.y * canvas.height, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  } catch (err) {
    console.error(err);
  }
  try { handViewState.paintStage(); } catch (err) { console.error(err); }
  requestAnimationFrame(predictLoop);
}

function beginRound() {
  if (running) return;
  running = true;
  if (mode !== "contest") $("btnStrike").disabled = false;
  endAt = performance.now() + left * 1000;
  $("instr").textContent = "交错击桩 · 听指示换招。1 分钟内按序有效击 10 次；维持 3 秒或瞬时有效均可过；击后冷却 2 秒。";
  applyStepVisual();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
}

async function start() {
  resetIdle();
  if (mode === "drill" && !camReady) {
    awaitBoth = false;
    handFollow = false;
    handViewState.setPrompt(false);
    $("btnStrike").disabled = false;
    setCamStatus("调试·无摄像头");
    $("note").textContent = "无摄像头可按 F/J 调试：F=左手冲拳，J=右手膀手；也可用触控演示。";
    showBanner("调试开课 · F/J", 1400);
    beginRound();
    try { await initPose(); } catch (e) { console.error(e); }
    return;
  }
  const okCam = await ensureCamera();
  if (!okCam && mode === "contest") {
    showBanner("比赛专用需摄像头，请先点「开启摄像头」", 2000);
    setCamStatus("待开启");
    return;
  }
  if (mode === "drill") {
    awaitBoth = true;
    handFollow = false;
    handViewState.setPrompt(true);
    $("btnStrike").disabled = false;
    setCamStatus("请双手入镜");
    $("note").textContent = "双手同时入镜后开课。无摄像头可按 F/J 调试。";
    showBanner("请双手入镜", 1600);
  }
  try { await initPose(); }
  catch (e) {
    const msg = (e && (e.message || String(e))) || "未知错误";
    if (!poseLandmarker) {
      setCamStatus("模型失败");
      $("note").textContent = "姿态模型加载失败：" + msg + "。日课可按 F/J 或触控演示；可点「重试模型」。";
    }
    console.error(e);
  }
  if (handLoading) {
    try {
      await Promise.race([
        handLoading,
        new Promise((resolve) => setTimeout(resolve, 2500)),
      ]);
    } catch (err) { console.warn(err); }
  }
  if (mode === "drill") {
    setCamStatus("请双手入镜");
    $("note").textContent = okCam && handLandmarker
      ? "双手同时入镜后开课。触控演示／F／J 可不经双手门。"
      : "双手入镜后开课；也可关摄像头用 F/J 调试。";
    return;
  }
  beginRound();
}

function finish(pass) {
  running = false;
  awaitBoth = false;
  handFollow = false;
  $("btnStrike").disabled = true;
  cancelAnimationFrame(raf);
  setHandGatePause(false);
  setPaused(false);
  $("hud").classList.remove("urgent");
  $("armRU").classList.remove("target-punch", "target-bong");
  $("armMid").classList.remove("target-punch", "target-bong");
  const contest = mode === "contest";
  $("resultTitle").textContent = pass
    ? (contest ? "咏春比赛专用 · 达成" : "过关。下一课。")
    : (contest ? "咏春比赛专用 · 未达成" : "再来一课。");
  $("resultBody").textContent =
    `完成 ${step}/10 · 剩余 ${Math.ceil(left)}s · 谱：` +
    SEQ.map((id) => MOVES[id].short).join("-");
  $("overlay").classList.add("show");
}

function pulseMoveSide(shape) {
  const side = shape === "straight" ? "L" : shape === "bridge" ? "R" : null;
  if (side) handViewState.pulse(side);
}

function openDrillWithoutCamera() {
  awaitBoth = false;
  handFollow = false;
  setHandGatePause(false);
  handViewState.setPrompt(false);
  beginRound();
}

function tryKeyDrive(shape) {
  if (mode === "contest" || step >= 10) return;
  if ($("overlay").classList.contains("show")) return;
  pulseMoveSide(shape);
  if (!running) openDrillWithoutCamera();
  const need = required();
  if (shape === need.shape) onHitValid(true);
  else onHitWrong("须出" + need.name);
}

function tryTapFallback() {
  if (mode === "contest" || step >= 10) return;
  if (!running) openDrillWithoutCamera();
  pulseMoveSide(required().shape);
  onHitValid(true);
}

$("btnMode").onclick = () => {
  mode = mode === "drill" ? "contest" : "drill";
  setModeUI();
};
$("btnStart").onclick = () => { start(); };
$("btnAgain").onclick = () => { start(); };
async function openCameraFromClick() {
  const ok = await ensureCamera();
  if (!ok) return;
  if (!handLandmarker) handFailed = false;
  try { await initPose(); } catch (e) { console.error(e); }
}

$("btnCamDock").onclick = () => { openCameraFromClick(); };
$("btnStrike").onclick = tryTapFallback;

window.addEventListener("keydown", (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === "f") {
    e.preventDefault();
    tryKeyDrive("straight");
  } else if (k === "j") {
    e.preventDefault();
    tryKeyDrive("bridge");
  } else if (k === "d") {
    e.preventDefault();
    setDebugMode(!debugMode);
  }
});

resetIdle();
setCamStatus("待开启 · 日课可直接开始");
$("note").textContent = secureHint() || "日课可直接开始（F=冲／J=膀）；开摄像头后须双手入镜（HTTPS／localhost）";

$("btnRetryModel") && ($("btnRetryModel").onclick = () => {
  if (handLandmarker && handLandmarker.close) {
    try { handLandmarker.close(); } catch (err) { console.warn(err); }
  }
  handToken += 1;
  handLandmarker = null;
  handFailed = false;
  handLoading = null;
  poseLandmarker = null;
  poseLoading = null;
  PoseLandmarker = null;
  HandLandmarker = null;
  FilesetResolver = null;
  initPose().then(() => showBanner(handLandmarker ? "姿态与手模已就绪" : "姿态已就绪", 1000)).catch((e) => {
    showBanner("模型仍失败", 1400);
    console.error(e);
  });
});

predictLoop();
(async () => {
  try {
    if (window.isSecureContext) await initPose();
  } catch (e) {
    console.error(e);
    const msg = (e && (e.message || String(e))) || "未知错误";
    setCamStatus("模型失败");
    $("note").textContent = "姿态模型预加载失败：" + msg + "。日课可用触控；可点「重试模型」或确认 mediapipe/ 同目录。";
  }
})();
</script>
