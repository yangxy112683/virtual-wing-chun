<style>

  /* CSS 木桩外观已由实拍图取代；.dummy 只剩几何盒子，用来定位和缩放 .scene 图 */

  .arm.target-punch .hit-pt::after, .arm.target-bong .hit-pt::after {
    content: "";
    position: absolute; left: 50%; top: 50%;
    height: 760%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 3px solid currentColor;
    box-shadow: 0 0 12px currentColor;
    pointer-events: none;
  }
  /* 受击高亮：自带描边与色值，不依赖 target-* 类，本击的靶臂在计击之后仍会闪 */

    outline: 3px solid rgba(255,214,170,0.95);

  }

  }
  /* 接触瞬间的冲击光圈 */

  }
  @keyframes punchLoop {

  }
  @keyframes punchGlow {
    0%, 35% { opacity: 0.15; }

  }
  /* 膀：斜下伸臂—停 0.35s ≈ 1.0s */
  .sil.bong .pose-bong .bridge {

  }

  }
  @keyframes bongLoop {

  .sfx {

  }
  .flash { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .flash.ok { background: rgba(232,215,195,0.07); }
  .flash.bad { background: rgba(120,120,120,0.12); }
  .banner {
    position: absolute; left: 50%; top: 48%; transform: translate(-50%,-50%);

  }
  .banner.show { opacity: 1; }

  .bottom-chrome {
    position: absolute; left: 10px; right: 10px;
    bottom: max(10px, env(safe-area-inset-bottom, 0px));

  }

  }
  .dock-tools button { padding: 9px 4px; font-size: 12px; }
  .ghost { background: rgba(255,255,255,0.08); color: var(--ok); }
  .primary { background: var(--red); color: #fff; }
  .strike-btn { background: #2a6f8f; color: #fff; }
  .strike-btn:disabled, .strike-btn.hidden { opacity: 0.35; }
  .strike-btn.hidden { visibility: hidden; }
  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.62);
    display: none; align-items: center; justify-content: center; z-index: 20; padding: 24px;
  }
  .overlay.show { display: flex; }
  .card {
    width: 100%; max-width: 300px; background: #1c1612; border-radius: 16px;
    padding: 20px; border: 1px solid rgba(196,60,46,0.4); text-align: center;
  }

  .hand-overlay {

  /* 竖屏适配暂停：竖屏原本只给画布底部条带（靶臂下方），现在按整块舞台走。

      max-width: none; width: 100%; margin: 0;
      height: 100dvh; min-height: 0; overflow: hidden;

      grid-template-columns: clamp(180px, 20vw, 340px) minmax(0, 1fr) clamp(220px, 22vw, 360px);
      grid-template-rows: minmax(0, 1fr);
      grid-template-areas: "side stage rail";
      --pole-x: 50%;
      background:
        radial-gradient(ellipse at 50% 42%, #5a4030 0%, transparent 48%),
        linear-gradient(180deg, #2a1c14 0%, #12100e 55%, #0a0908 100%);

    }
    .overlay { grid-area: 1 / 1 / -1 / -1; }
    .cam-wrap {
      position: relative; left: auto; top: auto; right: auto; bottom: auto;
      width: 100%; height: auto; aspect-ratio: 4 / 3;
      flex: 0 0 auto; z-index: 1;
    }
    .cam-status { font-size: clamp(10px, 1.3vh, 13px); }
    .topbar {
      position: static; left: auto; right: auto; top: auto;
      letter-spacing: 0.12em; font-size: clamp(11px, 1.4vh, 14px);
    }
    .hud {
      position: static; top: auto; right: auto; left: auto; z-index: auto;
      padding: clamp(8px, 1.1vh, 14px);
      grid-template-columns: clamp(40px, 8vh, 72px) minmax(0, 1fr);
      gap: clamp(4px, 0.7vh, 8px); align-items: center;
      flex: 0 1 auto; min-height: 0;
    }
    .hud-main { display: contents; }

      width: clamp(40px, 8vh, 72px); height: clamp(40px, 8vh, 72px);

    .timer-wrap svg { width: 100%; height: 100%; }
    .timer-wrap .t { font-size: clamp(13px, 2vh, 20px); }
    .step-tag { grid-column: 1 / -1; grid-row: 1; font-size: clamp(14px, 2.4vh, 26px); line-height: 1.25; }
    .count { grid-column: 2; grid-row: 2; font-size: clamp(12px, 1.7vh, 18px); margin-top: 0; }
    .instr { grid-column: 1 / -1; grid-row: 3; font-size: clamp(11px, 1.7vh, 16px); line-height: 1.35; }

    .seq { grid-column: 1 / -1; grid-row: 6; margin-top: clamp(4px, 0.6vh, 8px); }
    .seq span {
      width: clamp(16px, 2.6vh, 28px); height: clamp(16px, 2.6vh, 28px);
      border-radius: 4px; font-size: clamp(9px, 1.4vh, 13px);
    }
    .dummy {
      left: calc(var(--pole-x) - var(--dummy-w) / 2);
      top: calc(50% - var(--dummy-h) / 2);
      width: var(--dummy-w); height: var(--dummy-h);

    }
    .arm-side {
      display: block; position: absolute; z-index: 6; overflow: visible; pointer-events: none;
      left: calc(var(--pole-x) - var(--dummy-w) / 2);

      width: var(--dummy-w); height: var(--dummy-h);
    }
    .pole { width: 9%; margin-left: 0; transform: translateX(-50%); z-index: 3; }
    .arm.lu {
      left: auto; right: 50%; width: 32%; height: 5.6%;
      transform-origin: right center;

    .arm.ru {
      left: 50%; width: 32%; height: 5.6%;

    }
    .arm.mid {
      left: 50%; width: 32%; height: 6.2%;
      transform-origin: left center;
    }
    .leg {
      left: 50%; width: 5%; height: 22%;
      transform: rotate(-18deg);
      transform-origin: top left;
    }
    .arm.target-punch, .arm.target-bong { outline-width: 4px; }
    .demo-card {
      position: relative; left: auto; right: auto; top: auto; bottom: auto;
      flex: 1 1 auto; min-height: 0;
      width: 100%; max-width: none; z-index: auto; box-shadow: none;
      display: flex; flex-direction: column; overflow: hidden;

    .demo-cmd { font-size: clamp(13px, 1.9vh, 20px); }

    .sil { flex: 1 1 auto; height: auto; min-height: 0; margin: 0; }
    .sfx {

    .bottom-chrome {

    .bottom-chrome button {
      padding: clamp(8px, 1.35vh, 16px) 8px;

    .hand-overlay {
      top: 0; right: 0; bottom: 0; left: 0;

  @keyframes popWide {
    0% { opacity: 0; transform: translate(-100%, -30%) scale(0.85); }
    30% { opacity: 1; transform: translate(-100%, -50%) scale(1); }

</style>
</head>
<body>

<script type="module">
import {
  captureTipAudience,
  formatCountLine,
  releaseDebugCaptureTip,
  showCaptureTipText,
} from "./capture-tip.mjs";

let PoseLandmarker = null;
let HandLandmarker = null;
let FilesetResolver = null;

async function loadVisionLib() {
  const errors = [];
  const candidates = [
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm",
    "https://unpkg.com/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs",
    new URL("./mediapipe/tasks-vision.js", import.meta.url).href,
  ];
  for (const url of candidates) {
    try {
      const m = await import(url);
      PoseLandmarker = m.PoseLandmarker;
      HandLandmarker = m.HandLandmarker || null;
      FilesetResolver = m.FilesetResolver;
      return url.includes("./mediapipe/") ? "local" : url;
    } catch (e) {
      errors.push((url.includes("./mediapipe/") ? "local" : url) + ": " + (e && e.message ? e.message : e));
    }
  }
  throw new Error("姿态库脚本加载失败 → " + errors.join(" | "));
}

const P = "yat_ji_chung_kuen";
const B = "bong_sau";
const TIME_LIMIT = 60;
const HIT_GOAL = 10;
const POST_HIT_COOLDOWN = 500; // 有效击后冷却 0.5s
const HOLD_PASS_MS = 1000; // 同一招连续维持 1s 过关（与瞬时 ok 双路径）
const HOLD_FRAMES = 5; // 瞬时有效路径的连续帧去抖

const MOVES = {
  yat_ji_chung_kuen: {
    name: "日字冲拳", short: "冲拳", shape: "straight",
    armId: "armRU", ok: "笃", sil: "punch", targetClass: "target-punch",
  },
  bong_sau: {
    name: "膀手", short: "膀手", shape: "bridge",
    armId: "armMid", ok: "沙—笃", sil: "bong", targetClass: "target-bong",
  },
};

const MOVE_ID_OF_SHAPE = { straight: P, bridge: B };
const moveOfShape = (shape) => MOVES[MOVE_ID_OF_SHAPE[shape]] || null;

const ROUND_PHASE = Object.freeze({
  IDLE: "idle",
  WAITING_FOR_BOTH: "waiting_for_both",
  ACTIVE: "active",
  FINISHED: "finished",
});

const ROUND_NEXT = Object.freeze({
  [ROUND_PHASE.IDLE]: [ROUND_PHASE.WAITING_FOR_BOTH, ROUND_PHASE.ACTIVE],
  [ROUND_PHASE.WAITING_FOR_BOTH]: [ROUND_PHASE.ACTIVE, ROUND_PHASE.IDLE],
  [ROUND_PHASE.ACTIVE]: [ROUND_PHASE.FINISHED, ROUND_PHASE.IDLE],
  [ROUND_PHASE.FINISHED]: [ROUND_PHASE.IDLE],
});

let mode = "drill"; // drill | contest
let hits = []; // 实际击打序列，元素为 { move, side }
let left = TIME_LIMIT;
let endAt = 0;
let posePaused = false;
let pauseAnchor = 0;
let raf = 0;
let roundPhase = ROUND_PHASE.IDLE;
let lastHitAt = 0;
let holdKey = null; // side + shape，换手换招都算换键
let holdCount = 0;
let holdAccum = 0;
let holdLastTs = 0;
// 计过击的手臂须先换招、收回或出画才能再计
const armLock = { L: null, R: null };
let camReady = false;
let poseLandmarker = null;
let poseLoading = null;
let handLandmarker = null;
let handFailed = false;
let handLoading = null;
let handToken = 0;
let visionSession = null;
let lastVideoTime = -1;
let lastSyncTs = -1;
let stream = null;
let lostStreak = 0;
const LOST_FRAMES = 14; // ~0.2s+ before soft-pause; cuts false「回到框内」

const $ = (id) => document.getElementById(id);

function debugFromLocation() {
  const value = new URLSearchParams(location.search).get("debug");
  if (value == null) return false;
  return value === "" || value === "1" || value === "true";
}

let debugMode = debugFromLocation();
let countDetail = "识别：—";

function setCamStatus(text) {
  $("camStatus").textContent = showCaptureTipText(text, debugMode);
}

function setCountDetail(detail) {
  countDetail = detail || "";
  $("count").textContent = formatCountLine(hits.length, countDetail, debugMode);
}

function setDebugMode(on) {
  debugMode = !!on;
  const el = $("camStatus");
  if (!debugMode) el.textContent = releaseDebugCaptureTip(el.textContent);
  $("count").textContent = formatCountLine(hits.length, countDetail, debugMode);
  showBanner(debugMode ? "调试提示：开" : "调试提示：关", 800);
}

const circum = 2 * Math.PI * 28;

function angleDeg(a, b, c) {
  const ba = { x: a.x - b.x, y: a.y - b.y };
  const bc = { x: c.x - b.x, y: c.y - b.y };
  const dot = ba.x * bc.x + ba.y * bc.y;
  const m = Math.hypot(ba.x, ba.y) * Math.hypot(bc.x, bc.y) || 1e-6;
  return Math.acos(Math.min(1, Math.max(-1, dot / m))) * 180 / Math.PI;
}

function armOf(lm, side) {
  if (side === "L") return { sh: lm[11], el: lm[13], wr: lm[15], side: "L" };
  return { sh: lm[12], el: lm[14], wr: lm[16], side: "R" };
}

function armVisible(arm) {
  if (!arm || !arm.sh || !arm.el || !arm.wr) return false;
  const vis = Math.min(arm.sh.visibility ?? 1, arm.el.visibility ?? 1, arm.wr.visibility ?? 1);
  return vis >= 0.4;
}

function inFrame(arm) {
  const core = [arm.sh, arm.el].filter(Boolean);
  const soft = [arm.wr].filter(Boolean);
  const coreOk = core.every((p) => p.x > 0.01 && p.x < 0.99 && p.y > 0.01 && p.y < 0.99);
  const softOk = soft.every((p) => p.x > -0.05 && p.x < 1.05 && p.y > -0.08 && p.y < 1.05);
  return coreOk && softOk;
}

/** 单臂 up／down 分；冲看 up，膀看 down（画面 y 向下） */
function armScores(arm) {
  const { sh, el, wr } = arm;
  const reach = Math.hypot(wr.x - sh.x, wr.y - sh.y);
  const foreshort = Math.abs((wr.z ?? 0) - (sh.z ?? 0));
  const dy = wr.y - sh.y;
  const dx = Math.abs(wr.x - sh.x);
  const wristAboveElbow = wr.y < el.y - 0.01;
  const wristBelowElbow = wr.y > el.y + 0.01;
  const MIN_REACH = 0.10;
  const MIN_EXT = Math.max(reach, foreshort * 1.2);
  if (MIN_EXT < MIN_REACH && dx < 0.06) {
    return { upScore: -1, downScore: -1, dy, reach, foreshort, weak: "未出招" };
  }
  let upScore = -1;
  if (dy < -0.02 || (wristAboveElbow && dy < 0.04)) {
    upScore =
      Math.max(0, -dy) / 0.18 +
      Math.min(0.5, reach / 0.28) +
      Math.min(0.35, foreshort * 2.5) +
      (wristAboveElbow ? 0.25 : 0);
  }
  let downScore = -1;
  if (dy > 0.02 || (wristBelowElbow && dy > -0.04)) {
    downScore =
      Math.max(0, dy) / 0.18 +
      Math.min(0.5, reach / 0.28) +
      Math.min(0.35, foreshort * 2.5) +
      (wristBelowElbow ? 0.25 : 0);
  }
  return { upScore, downScore, dy, reach, foreshort, weak: null };
}

function scoreToCandidate(shape, side, score, dy) {
  const conf = Math.min(0.98, 0.52 + score * 0.22);
  return {
    shape,
    side,
    score,
    quality: conf >= 0.58 ? "ok" : "near",
    confidence: conf,
    detail: (shape === "straight" ? "冲↑" : "膀↓") + ` dy=${dy.toFixed(2)}`,
  };
}

/** 单臂判别：up 分与 down 分谁高就是谁，两臂两招都认 */
function classifyArm(arm, label) {
  if (!inFrame(arm)) return { detail: label + "出画" };
  const s = armScores(arm);
  if (s.weak) return { detail: s.weak };
  if (s.upScore < 0.2 && s.downScore < 0.2) return { detail: label + "方向不明" };
  if (s.upScore > 0 && s.downScore > 0 && Math.abs(s.upScore - s.downScore) < 0.12) {
    return { detail: label + "上下接近" };
  }
  const up = s.upScore >= s.downScore;
  const primary = up ? s.upScore : s.downScore;
  if (primary < 0.28) return { detail: label + "弱特征" };
  return { candidate: scoreToCandidate(up ? "straight" : "bridge", arm.side, primary, s.dy) };
}

function lostCandidate(detail) {
  return { shape: "unknown", quality: "lost", confidence: 0, detail, side: null };
}

function nearCandidate(detail, side) {
  return { shape: "unknown", quality: "near", confidence: 0.2, detail, side: side || null };
}

/** 两臂自由判定：都判同一时刻的招形，取分数高的一条；上锁的手臂跳过 */
function classifyPose(lm, active) {
  const arms = [armOf(lm, "L"), armOf(lm, "R")];
  if (!arms.some(armVisible)) return lostCandidate("无人");
  if (!active) return nearCandidate("待开课");
  let best = null;
  let detail = "";
  for (const arm of arms) {
    const label = arm.side === "L" ? "左臂" : "右臂";
    const found = armVisible(arm) ? classifyArm(arm, label) : { detail: label + "出画" };
    const c = found.candidate;
    if (!c || c.shape !== armLock[arm.side]) armLock[arm.side] = null;
    if (!c || armLock[arm.side]) {
      detail = detail || found.detail || label + "待收招";
      continue;
    }
    if (!best || c.score > best.score) best = c;
  }
  return best || nearCandidate(detail);
}

/** 触控演示按已计击数的奇偶轮换：偶数次左手冲拳，奇数次右手膀手 */
function nextTapMove() {
  const leftPunch = hits.length % 2 === 0;
  return leftPunch
    ? { move: P, side: "L", name: "左手冲拳" }
    : { move: B, side: "R", name: "右手膀手" };
}

/** 右栏实时序列：每计一击追加一个招式小块 */
function buildHitSeqUI() {
  const box = $("hitSeq");
  if (!box) return;
  box.innerHTML = "";
  hits.forEach((hit) => {
    const mv = MOVES[hit.move];
    const sp = document.createElement("span");
    sp.textContent = mv.short;
    sp.className = mv.sil;
    box.appendChild(sp);
  });
}

/** 两个靶区同时高亮，手模与触控按钮跟随自由击桩 */
function applyHitVisual() {
  $("armRU").className = "arm ru " + MOVES[P].targetClass;
  $("armMid").className = "arm mid " + MOVES[B].targetClass;
  $("btnStrike").textContent = "触控演示 · " + nextTapMove().name;
  buildHitSeqUI();
}

function setModeUI() {
  const c = mode === "contest";
  $("topbar").textContent = c ? "咏春比赛专用" : "";
  $("topbar").classList.toggle("contest", c);
  $("btnMode").textContent = c ? "比赛" : "日课";
  $("btnStrike").classList.toggle("hidden", c);
  if (c) $("btnStrike").disabled = true;
  else if (roundPhase === ROUND_PHASE.ACTIVE) $("btnStrike").disabled = false;
}

function showBanner(text, ms = 900) {
  const b = $("banner");
  b.textContent = text;
  b.classList.add("show");
  clearTimeout(showBanner._t);
  showBanner._t = setTimeout(() => b.classList.remove("show"), ms);
}

function setRoundPhase(next) {
  if (next === roundPhase) return;
  if (ROUND_NEXT[roundPhase].indexOf(next) < 0) return;
  roundPhase = next;
  if (next === ROUND_PHASE.IDLE || next === ROUND_PHASE.WAITING_FOR_BOTH || next === ROUND_PHASE.FINISHED) {
    cancelAnimationFrame(raf);
    raf = 0;
  }
  if (next === ROUND_PHASE.IDLE) {
    posePaused = false;
    $("camWrap").classList.remove("lost");
  } else if (next === ROUND_PHASE.ACTIVE) {
    endAt = performance.now() + left * 1000;
    if (mode !== "contest") $("btnStrike").disabled = false;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  } else if (next === ROUND_PHASE.FINISHED) {
    $("btnStrike").disabled = true;
  }
}

function setPaused(on) {
  if (on === posePaused) return;
  posePaused = on;
  if (on) {
    pauseAnchor = performance.now();
    $("camWrap").classList.add("lost");
    showBanner("回到框内", 1200);
    return;
  }
  if (roundPhase === ROUND_PHASE.ACTIVE) endAt += performance.now() - pauseAnchor;
  $("camWrap").classList.remove("lost");
}

function resetIdle() {
  hits = []; left = TIME_LIMIT; lastHitAt = 0;
  holdKey = null; holdCount = 0; holdAccum = 0; holdLastTs = 0;
  armLock.L = null; armLock.R = null;
  pendingImpact = null;
  posePaused = false;
  if (typeof handViewState !== "undefined" && handViewState.reset) handViewState.reset();
  setHoldUI(false);
  setCountDetail("识别：—");

  $("note").textContent = camReady
    ? "点开始；双手入镜后开课。无摄像头可按 F/J 调试。"
    : "日课可直接开始（无摄像头按 F/J 调试）；开摄像头后须双手入镜。";

function tick() {
  if (roundPhase !== ROUND_PHASE.ACTIVE) return;
  if (!posePaused) {
    left = Math.max(0, (endAt - performance.now()) / 1000);
  }
  $("timerText").textContent = Math.ceil(left);
  $("ring").style.strokeDashoffset = String(circum * (1 - left / TIME_LIMIT));
  $("hud").classList.toggle("urgent", left > 0 && left <= 3);
  if (left <= 0) return finish(false);
  raf = requestAnimationFrame(tick);
}

function secureHint() {
  if (!window.isSecureContext) {
    return "当前不是安全上下文（file:// 常被拦）。请用 localhost 或 HTTPS 打开后再点「开启摄像头」。";
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return "当前浏览器无法调摄像头。请用 Safari／Chrome，并用 HTTPS 或 localhost 打开（勿用 file://）。";
  }
  return "";
}

async function ensureCamera() {
  if (stream) return true;
  const hint = secureHint();
  if (hint) {
    camReady = false;
    setCamStatus("需 HTTPS／localhost");
    showBanner("请用本机服务打开", 2200);
    $("note").textContent = hint;
    return false;
  }
  try {
    setCamStatus("申请权限…");
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      });
    } catch (e1) {
      // Safari 常对 ideal 尺寸更严，降级再试
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: "user" } },
      });
    }
    const video = $("video");
    video.srcObject = stream;
    await video.play();
    camReady = true;
    setCamStatus("识别中…");
    $("overlay").classList.remove("show");
    $("note").textContent = "点开始；双手入镜后开课。无摄像头可按 F/J 调试。";
    if (!handLandmarker) handFailed = false;
    return true;
  } catch (err) {
    camReady = false;
    setCamStatus("权限失败／待开启");
    showBanner("请允许摄像头后点「开启摄像头」", 2200);
    $("note").textContent = "摄像头未授权；日课可直接开始，按 F/J 或触控演示调试。错误：" + (err && err.name ? err.name : "unknown");
    return false;
  }
}

async function initPose() {
  if (poseLandmarker) {
    if (!handLandmarker && !handFailed && visionSession) kickHand(visionSession.vision, visionSession.delegate);
    return poseLandmarker;
  }
  if (poseLoading) return poseLoading;
  setCamStatus("加载识别模型…");
  $("note").textContent = "正在加载姿态模型（可先用触控演示开课）…";
  poseLoading = (async () => {
    if (!PoseLandmarker) {
      const src = await loadVisionLib();
      console.log("vision lib", src);
    }
    const wasmCandidates = [
      new URL("./mediapipe", import.meta.url).href,
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm",
      "https://unpkg.com/@mediapipe/tasks-vision@0.10.18/wasm",
    ];
    const modelCandidates = [
      new URL("./mediapipe/pose_landmarker_lite.task", import.meta.url).href,
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
    ];
    let lastErr = null;
    for (const wasm of wasmCandidates) {
      let vision;
      try {
        vision = await FilesetResolver.forVisionTasks(wasm);
      } catch (e) {
        lastErr = e;
        console.warn("wasm fail", wasm, e);
        continue;
      }
      for (const model of modelCandidates) {
        for (const delegate of ["CPU", "GPU"]) {
          try {
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
              baseOptions: { modelAssetPath: model, delegate },
              runningMode: "VIDEO",
              numPoses: 1,
            });
            console.log("pose ok", { wasm, model, delegate });
            visionSession = { vision, delegate };
            setCamStatus(camReady ? "识别待命" : "模型就绪·请开摄像头");
            if (roundPhase === ROUND_PHASE.IDLE) $("note").textContent = "姿态已就绪，正在加载手模。日课与触控演示可用。";
            kickHand(vision, delegate);
            return poseLandmarker;
          } catch (e) {
            lastErr = e;
            console.warn("model fail", model, delegate, e);
          }
        }
      }
    }
    const msg = (lastErr && (lastErr.message || String(lastErr))) || "未知错误";
    setCamStatus("模型失败");
    $("note").textContent = "姿态模型加载失败：" + msg + "。请用本机服务打开并保留 mediapipe 文件夹；日课仍可用触控演示。";
    poseLoading = null;
    throw lastErr || new Error(msg);
  })();
  return poseLoading;
}

function detectHandPackets(video, syncTs) {
  try {
    const handResult = handLandmarker.detectForVideo(video, syncTs);
    const marks = (handResult && handResult.landmarks) || [];
    const handed = (handResult && handResult.handedness) || [];
    return marks.map((lm, i) => {
      const cat = handed[i] && handed[i][0];
      const name = cat && (cat.categoryName || cat.displayName || "");
      return {
        lm,
        side: name === "Left" || name === "Right" ? name : "",
        score: cat && cat.score ? cat.score : 0,
      };
    });
  } catch (err) {
    console.warn("hand frame", err);
    return [];
  }
}

function findBothHands(packets) {
  const ranked = [];
  const list = packets || [];
  for (let i = 0; i < list.length; i++) {
    const item = list[i];
    if (!item || !item.lm || !item.lm[0] || item.lm[0].x == null) continue;
    ranked.push(item);
  }
  ranked.sort((a, b) => (b.score || 0) - (a.score || 0));
  const top = ranked.slice(0, 2);
  if (top.length < 2) return null;
  top.sort((a, b) => a.lm[0].x - b.lm[0].x);
  // Unmirrored selfie frame: smaller x is the person's right hand.
  return {
    right: { lm: top[0].lm, side: "Right", score: top[0].score || 0 },
    left: { lm: top[1].lm, side: "Left", score: top[1].score || 0 },
  };
}

const LANDSCAPE_MQ = "(orientation: landscape) and (min-width: 1000px)";
const HAND_H_LAND = 0.47;
// 木桩实拍图在舞台里的取景框（相对 .dummy 盒子），用来把图铺到原桩位
const SCENE_FIT = { cx: DUMMY_ART.trunkX, top: 0.06, bottom: 0.985 };
let stagePoleFrac = 0.5;
let stageReachFrac = 0.18;
let sceneBox = null; // { left, top, width, height } 舞台内坐标，单位 px

function zoneEls() {
  return { ru: $("armRU"), mid: $("armMid") };
}

/** 把 scene 图按 .dummy 盒子摆好，并把两个靶区贴到图上对应的桩手位置 */
function syncStageGeom() {
  const stage = document.querySelector(".stage");
  if (!stage) return;
  const sr = stage.getBoundingClientRect();
  if (sr.width < 2 || sr.height < 2) return;

  const raw = getComputedStyle(stage).getPropertyValue("--pole-x").trim();
  const dummy = stage.querySelector(".dummy");
  const pole = stage.querySelector(".pole");
  if (dummy && sr.width > 1) {
    const dr = dummy.getBoundingClientRect();
    stagePoleFrac = (dr.left + dr.width / 2 - sr.left) / sr.width;
  } else if (raw.endsWith("%")) {
    stagePoleFrac = parseFloat(raw) / 100;
  } else if (pole && sr.width > 1) {
    const pr = pole.getBoundingClientRect();
    stagePoleFrac = (pr.left + pr.width / 2 - sr.left) / sr.width;
  }

  if (dummy) {
    const dr = dummy.getBoundingClientRect();
    const boxLeft = dr.left - sr.left;
    const boxTop = dr.top - sr.top;
    const boxW = dr.width;
    const boxH = dr.height;
    // 图里木桩的树干中线落在 .dummy 的水平中线上；桩顶对齐盒子顶、底座对齐盒子底
    const imgW = boxH / ((SCENE_FIT.bottom - SCENE_FIT.top) * (1117 / 1728) / 1) * 0;
    void imgW;
    // 用「树干高度 = 盒子高度」来定图高，宽度按图片比例
    const artH = (SCENE_FIT.bottom - SCENE_FIT.top); // 图内树干纵向占比
    const imgH = boxH / artH;
    const imgW2 = imgH * (1728 / 1117);
    const left = boxLeft + boxW / 2 - DUMMY_ART.trunkX * imgW2;
    const top = boxTop - SCENE_FIT.top * imgH;
    sceneBox = { left, top, width: imgW2, height: imgH };
  }

  const img = $("sceneImg");
  if (img && sceneBox) {
    img.style.transform = `translate(${sceneBox.left}px, ${sceneBox.top}px)`;
    img.style.width = `${sceneBox.width}px`;
    img.style.height = `${sceneBox.height}px`;
    if (!img.classList.contains("ready")) img.classList.add("ready");
  }

  const z = zoneEls();
  if (sceneBox && z.ru && z.mid) {
    // 靶区盒子：桩手端点周围一小块，边长随图缩放
    const unit = sceneBox.width;
    const rw = unit * 0.085;
    const rh = unit * 0.085;
    const place = (el, art) => {
      const x = sceneBox.left + art.x * sceneBox.width;
      const y = sceneBox.top + art.y * sceneBox.height;
      el.style.left = `${x - rw / 2}px`;
      el.style.top = `${y - rh / 2}px`;
      el.style.width = `${rw}px`;
      el.style.height = `${rh}px`;
    };
    place(z.ru, DUMMY_ART.ru);
    place(z.mid, DUMMY_ART.mid);
  }

  let reach = 0;
  const poleMidX = sr.left + sr.width * stagePoleFrac;
  // 只按两个靶区量臂展；.zones 是整块舞台，不能参与
  const probe = [$("armRU"), $("armMid")];
  probe.forEach((el) => {
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (!r.width) return;
    reach = Math.max(reach, poleMidX - r.left, r.right - poleMidX);
  });
  stageReachFrac = reach / sr.width;
}

/** 靶区掌心锚点在画布坐标里的位置（canvas 像素） */
function hitPointPx(armId, w, h) {
  const el = $(armId);
  const dot = el && el.querySelector(".hit-pt");
  const canvas = $("handCanvas");
  if (!dot || !canvas) return null;
  const dr = dot.getBoundingClientRect();
  const cr = canvas.getBoundingClientRect();
  if (cr.width < 2 || cr.height < 2) return null;
  const sx = w / cr.width;
  const sy = h / cr.height;
  return {
    x: (dr.left + dr.width / 2 - cr.left) * sx,
    y: (dr.top + dr.height / 2 - cr.top) * sy,
  };
}

function handExtents(dw, dh, u, v, tilt) {
  const c = Math.cos(tilt);
  const s = Math.sin(tilt);
  let minX = 0;
  let maxX = 0;
  const pts = [
    [-dw * u, -dh * v],
    [dw * (1 - u), -dh * v],
    [-dw * u, dh * (1 - v)],
    [dw * (1 - u), dh * (1 - v)],
  ];
  for (let i = 0; i < pts.length; i++) {
    const xr = pts[i][0] * c - pts[i][1] * s;
    if (xr < minX) minX = xr;
    if (xr > maxX) maxX = xr;
  }
  return { minX, maxX };
}

/* 竖屏适配暂停
 * 竖屏手模高度：以“靶臂下方剩余空间”为准（旧版画布只有底部条带，现在是整块舞台）
 * 横屏定稿后再恢复：把下面两个函数取消注释，并在 laneHand 里恢复 landscape 分支。
function chromeInsetPx(h) {
  const stage = document.querySelector(".stage");
  const chrome = document.querySelector(".bottom-chrome");
  const canvas = $("handCanvas");
  if (!stage || !chrome || !canvas) return 0;
  const sr = stage.getBoundingClientRect();
  const cr = chrome.getBoundingClientRect();
  const vr = canvas.getBoundingClientRect();
  if (vr.height < 2) return 0;
  const overlapX = Math.min(sr.right, cr.right) - Math.max(sr.left, cr.left);
  if (overlapX <= 1) return 0;
  const overlapY = sr.bottom - cr.top;
  if (overlapY <= 1) return 0;
  return (overlapY * (h / vr.height)) + h * 0.02;
}

function portraitHandH(w, h) {
  const mid = $("armMid");
  const canvas = $("handCanvas");
  if (!mid || !canvas) return h * 0.28;
  const mr = mid.getBoundingClientRect();
  const cr = canvas.getBoundingClientRect();
  if (cr.height < 2) return h * 0.28;
  const armBottomPx = (mr.bottom - cr.top) * (h / cr.height);
  const room = Math.max(0, h - chromeInsetPx(h) - armBottomPx);
  return Math.min(h * 0.30, Math.max(h * 0.12, room * 0.52));
}
*/  /* 竖屏适配暂停 结束 */

/** 固定车道：push 0 护手位，push 1 掌心落到本手这一击对应的靶区。 */
function laneHand(side, armId, push, w, h) {
  const p = Math.min(1, Math.max(0, push));
  // 竖屏适配暂停：只做横屏车道，非横屏也按横屏布局兜底
  const pole = w * stagePoleFrac;
  const img = skinImg[side];
  const aspect = img && img.naturalWidth ? img.naturalWidth / img.naturalHeight
    : (side === "Left" ? 354 / 768 : 350 / 768);
  const anchor = HAND_ANCHOR[side] || HAND_ANCHOR.Left;
  const tilt = side === "Left" ? 0.18 : -0.18;
  const scale = 1 - 0.15 * p;
  const dh = h * HAND_H_LAND * scale; // 竖屏适配暂停：原来按竖屏取 portraitHandH
  const dw = dh * aspect;

  // 护手位：横屏靠边；以贴图底边对齐舞台下沿
  const pad = Math.max(4, h * 0.012);
  const guardY = h - pad - (1 - anchor.palmY) * dh; // 竖屏适配暂停：原减 chromeInsetPx(h)
  let guardX;
  // 竖屏适配暂停：原来的竖屏分支（手放在杆两侧）已注释，恢复时取消注释并从下面 `{` 起改回 if/else
  // if (!landscape) {
  //   const gap = w * 0.22;
  //   guardX = side === "Left" ? pole - gap : pole + gap;
  // } else {
  {
    const ext = handExtents(dw, dh, anchor.palmX, anchor.palmY, tilt);
    const stage = document.querySelector(".stage");
    const cssW = stage ? stage.getBoundingClientRect().width : w;
    const dpr = cssW > 1 ? w / cssW : 1;
    const gap = Math.max(24 * dpr, w * 0.02);
    const reach = w * stageReachFrac + gap;
    guardX = side === "Left"
      ? pole - reach - ext.maxX
      : pole + reach - ext.minX;
  }

  // 接触位：掌心锚点压在靶区 .hit-pt 上，前臂从本侧画面下缘指向它
  const hit = p > 0.02 ? hitPointPx(armId, w, h) : null;
  // 到 0.97 就当已接触：吸到靶点，避免渐近值留下半像素误差
  const stretch = p > 0.97 ? 1 : p;

  let x;
  let y;
  if (hit && stretch > 0) {
    x = guardX + (hit.x - guardX) * stretch;
    y = guardY + (hit.y - guardY) * stretch;
  } else {
    x = guardX;
    y = guardY;
  }

  // 掌心锚点在贴图内是 (palmX, palmY)；画手时以锚点为中心旋转绘制
  return { x, y, tilt, side, scale, dh, dw, anchor, reach: p };
}

function fitHandFrame(host) {
  if (!host) return 0;
  /* 竖屏适配暂停：原逻辑在竖屏下把画布压到靶臂下方条带
   * 恢复时把下面 if 里的 return 去掉即可。
  if (!window.matchMedia(LANDSCAPE_MQ).matches) {
    const mid = $("armMid");
    const ru = $("armRU");
    if (mid && ru) {
      const armBottom = Math.max(mid.getBoundingClientRect().bottom, ru.getBoundingClientRect().bottom);
      const bottom = host.getBoundingClientRect().bottom;
      const room = Math.max(0, bottom - armBottom - 10);
      const stageH = host.parentElement ? host.parentElement.clientHeight : window.innerHeight;
      const px = Math.round(Math.min(stageH, room));
      const next = px + "px";
      if (host.style.height !== next) host.style.height = next;
      return px;
    }
  }
  */
  // 画布就是整块舞台（横屏定稿版）
  if (host.style.height) host.style.height = "";
  return host.clientHeight;
}

function shortestAngle(delta) {
  let d = delta;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

/** 画手：掌心锚点落在 at.x/at.y；at.reach>0 时前臂沿轴向拉到画面下缘以外 */
function drawSkinHand(ctx, img, at, h, alpha) {
  if (!img || !img.complete || !img.naturalWidth) return false;
  const anchor = at.anchor || HAND_ANCHOR[at.side] || HAND_ANCHOR.Left;
  const dh = at.dh;
  const dw = at.dw;
  const p = Math.min(1, Math.max(0, at.reach || 0));
  const iw = img.naturalWidth;
  const ih = img.naturalHeight;
  const cw = ctx.canvas.width;
  const ch = ctx.canvas.height;

  const yw = (anchor.wristY - anchor.palmY) * dh; // 掌锚点 → 腕线（本地 y）
  const tilt = at.tilt || 0;

  // 前臂轴向：护手位沿用旧的斜角，接触时指向本侧画面下缘外
  const exitX = at.side === "Left" ? cw * 0.26 : cw * 0.74;
  const exitY = ch + dh * 0.15;
  const axisAngle = Math.atan2(exitY - at.y, exitX - at.x) - Math.PI / 2;
  const phi = tilt + shortestAngle(axisAngle - tilt) * p;

  // 前臂长度：至少伸到画面下缘；按需拉伸（以腕线为锚点，手掌不变形）
  const rootLen = Math.max(1, (1 - anchor.palmY) * dh);
  const needLen = Math.hypot(exitX - at.x, exitY - at.y);
  const stretch = Math.min(2.8, Math.max(1, (needLen / rootLen - 1) * p + 1));

  ctx.save();
  ctx.globalAlpha = alpha;

  // 1) 前臂段：从腕线往下，沿轴向拉伸到画面外
  ctx.save();
  ctx.translate(at.x, at.y);
  ctx.rotate(phi);
  ctx.translate(0, yw);
  ctx.scale(1, stretch);
  ctx.translate(0, -yw);
  ctx.beginPath();
  ctx.rect(-dw * 1.4, yw - 1, dw * 2.8, dh * 2.4);
  ctx.clip();
  ctx.drawImage(img, -dw * anchor.palmX, -dh * anchor.palmY, dw, dh);
  ctx.restore();

  // 2) 手掌段：不拉伸，压在腕线上
  ctx.save();
  ctx.translate(at.x, at.y);
  ctx.rotate(phi);
  ctx.beginPath();
  ctx.rect(-dw * 1.4, -dh * 1.6, dw * 2.8, dh * 1.6 + yw + 1);
  ctx.clip();
  ctx.drawImage(img, -dw * anchor.palmX, -dh * anchor.palmY, dw, dh);
  ctx.restore();

  ctx.restore();
  void iw;
  void ih;
  return true;
}

/** 调试叠层：画两个靶区圆和掌心锚点十字（?debug=1 或按 D） */
function drawDebug(ctx, w, h) {
  // 落点数值始终写到 dataset，便于自动化核对（不开 debug 也写）
  const ptRu = hitPointPx("armRU", w, h);
  const ptMid = hitPointPx("armMid", w, h);
  const atL = laneHand("Left", handViewState.targetOf("L"), handViewState.pushOf("L"), w, h);
  const atR = laneHand("Right", handViewState.targetOf("R"), handViewState.pushOf("R"), w, h);
  const fmt = (at) => at ? `${Math.round(at.x / w * 1000) / 10},${Math.round(at.y / h * 1000) / 10},${(at.reach || 0).toFixed(2)}` : "-";
  const dotFmt = (pt) => pt ? `${Math.round(pt.x / w * 1000) / 10},${Math.round(pt.y / h * 1000) / 10}` : "-";
  ctx.canvas.dataset.palmL = fmt(atL);
  ctx.canvas.dataset.palmR = fmt(atR);
  ctx.canvas.dataset.hitRU = dotFmt(ptRu);
  ctx.canvas.dataset.hitMid = dotFmt(ptMid);
  if (!debugMode) return;
  ctx.save();
  ctx.lineWidth = Math.max(1, w / 700);
  const cross = (pt, color) => {
    if (!pt) return;
    const r = Math.max(6, w * 0.012);
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(pt.x - r, pt.y);
    ctx.lineTo(pt.x + r, pt.y);
    ctx.moveTo(pt.x, pt.y - r);
    ctx.lineTo(pt.x, pt.y + r);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r * 1.5, 0, Math.PI * 2);
    ctx.stroke();
  };
  const circle = (el, color) => {
    const dot = el && el.querySelector(".hit-pt");
    const canvas = $("handCanvas");
    if (!dot || !canvas) return;
    const zr = el.getBoundingClientRect();
    const cr = canvas.getBoundingClientRect();
    if (cr.width < 2) return;
    const sx = w / cr.width;
    const sy = h / cr.height;
    ctx.strokeStyle = color;
    ctx.strokeRect(
      (zr.left - cr.left) * sx, (zr.top - cr.top) * sy,
      zr.width * sx, zr.height * sy
    );
  };
  circle($("armRU"), "rgba(255,150,90,0.85)");
  circle($("armMid"), "rgba(120,220,255,0.85)");
  cross(ptRu, "rgba(255,150,90,1)");
  cross(ptMid, "rgba(120,220,255,1)");
  // 掌心锚点（当前 push 落在哪里），用来核对落点
  if (atL) cross({ x: atL.x, y: atL.y }, "rgba(120,255,140,1)");
  if (atR) cross({ x: atR.x, y: atR.y }, "rgba(255,120,255,1)");
  ctx.restore();
}

/** 一只手 + 一个招形对应的靶区：左手膀落到中桩，右手冲落到右上桩 */
function targetArmOf(side, shape) {
  if (shape === "bridge") return "armMid";
  if (shape === "straight") return "armRU";
  return side === "L" || side === "Left" ? "armRU" : "armMid";
}

function driveTagText(side, shape) {
  if (!side || !shape) return "";
  const hand = side === "L" ? "左手" : "右手";
  const move = moveOfShape(shape);
  return move ? hand + " · " + move.name : "";
}

function createHandViewState() {
  let present = "guard";
  let hold01 = 0;
  let pushL = 0;
  let pushR = 0;
  let targetL = 0;
  let targetR = 0;
  let shapeL = null;
  let shapeR = null;
  let pulseL = null;
  let pulseR = null;
  let lastSmoothAt = 0;
  let tagSide = null;
  let tagShape = null;

  function pulseGoal(pulse, now) {
    if (!pulse) return null;
    const t = now - pulse.t0;
    if (t < PULSE_PUSH_MS) return Math.min(1, t / PULSE_PUSH_MS);
    if (t < PULSE_PUSH_MS + PULSE_HOLD_MS) return 1;
    const back = t - PULSE_PUSH_MS - PULSE_HOLD_MS;
    if (back >= PULSE_RECOVER_MS) return null;
    return Math.max(0, 1 - back / PULSE_RECOVER_MS);
  }

  function desiredPush(side, now) {
    const pulse = side === "L" ? pulseL : pulseR;
    const fromPulse = pulseGoal(pulse, now);
    if (fromPulse == null && pulse) {
      if (side === "L") pulseL = null;
      else pulseR = null;
    }
    if (fromPulse != null) return fromPulse;
    return side === "L" ? targetL : targetR;
  }

  function setDrive(side, shape) {
    if (!side || (shape !== "straight" && shape !== "bridge")) return false;
    if (side === "L") {
      targetL = 1;
      targetR = 0;
      shapeL = shape;
    } else {
      targetR = 1;
      targetL = 0;
      shapeR = shape;
    }
    tagSide = side;
    tagShape = shape;
    present = shape === "straight" ? "punch_drive" : "bong_bridge";
    return true;
  }

  function clearDrive() {
    targetL = 0;
    targetR = 0;
    if (!pulseL && !pulseR) {
      tagSide = null;
      tagShape = null;
      present = "guard";
    }
  }

  return {
    reset() {
      present = "guard";
      hold01 = 0;
      pushL = 0;
      pushR = 0;
      targetL = 0;
      targetR = 0;
      shapeL = null;
      shapeR = null;
      pulseL = null;
      pulseR = null;
      lastSmoothAt = 0;
      tagSide = null;
      tagShape = null;
    },
    /** 触控／F／J 脉冲：任意手打任意招 */
    pulse(side, shape) {
      const now = performance.now();
      const s = shape === "bridge" ? "bridge" : "straight";
      if (side === "L") {
        pulseL = { t0: now };
        shapeL = s;
      } else if (side === "R") {
        pulseR = { t0: now };
        shapeR = s;
      } else {
        return;
      }
      tagSide = side;
      tagShape = s;
    },
    setPoseDrive(side, shape, quality) {
      const active = quality === "ok" || quality === "near";
      if (!active) {
        clearDrive();
        return;
      }
      if (!setDrive(side, shape)) clearDrive();
    },
    onHitOk() {},
    onHoldProgress(p) {
      hold01 = p > 0 ? Math.min(1, p) : 0;
    },
    /** 这只手当前前进的目标靶区 */
    targetOf(side) {
      const shape = side === "L" ? shapeL : shapeR;
      return targetArmOf(side, shape);
    },
    /** 这只手当前前推量（0 护手 → 1 接触） */
    pushOf(side) {
      if (side === "L") return pushL;
      if (side === "R") return pushR;
      return 0;
    },
    paint(ctx, w, h) {
      const now = performance.now();
      // 第一帧（reset 后）不跳变：护手位起步，之后按时间常数靠近目标
      let tAttack = 0;
      let tRelease = 0;
      if (lastSmoothAt) {
        const dt = now - lastSmoothAt;
        const clamp = (ms) => (dt > 200 ? 1 : (dt <= 0 ? 0 : 1 - Math.exp(-dt / ms)));
        tAttack = clamp(PUSH_ATTACK_MS);
        tRelease = clamp(PUSH_SMOOTH_MS);
      }
      lastSmoothAt = now;
      const wantL = desiredPush("L", now);
      const wantR = desiredPush("R", now);
      pushL += (wantL - pushL) * (wantL > pushL ? tAttack : tRelease);
      pushR += (wantR - pushR) * (wantR > pushR ? tAttack : tRelease);
      if (Math.abs(pushL) < 0.002) pushL = 0;
      if (Math.abs(pushR) < 0.002) pushR = 0;
      const alpha = 0.94 + hold01 * 0.06;
      drawSkinHand(ctx, skinImg.Left, laneHand("Left", targetArmOf("L", shapeL), pushL, w, h), h, alpha);
      drawSkinHand(ctx, skinImg.Right, laneHand("Right", targetArmOf("R", shapeR), pushR, w, h), h, alpha);
    },
    paintStage(visible) {
      const canvas = $("handCanvas");
      const tag = $("handTag");
      const host = $("handOverlay");
      if (host) {
        host.dataset.present = visible ? present : "need_both";
        host.dataset.hands = visible ? "both" : "need_both";
      }
      if (tag) {
        const text = !visible && camReady
          ? "请双手入镜"
          : (visible && (pushL > 0.08 || pushR > 0.08 || tagSide) ? driveTagText(tagSide, tagShape) : "");
        const cls = "hand-tag" + (text === "请双手入镜" ? " need" : "");
        if (tag.textContent !== text) tag.textContent = text;
        if (tag.className !== cls) tag.className = cls;
        tag.hidden = !text;
      }
      if (!canvas || !host) return;
      fitHandFrame(host);
      syncStageGeom();
      const rect = canvas.getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(rect.width * dpr));
      const hgt = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== hgt) {
        canvas.width = w;
        canvas.height = hgt;
      }
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, w, hgt);
      if (visible) this.paint(ctx, w, hgt);
      drawDebug(ctx, w, hgt);
      flushPendingImpact(performance.now());
    },
  };
}

const handViewState = createHandViewState();

function kickHand(vision, delegate) {
  initHand(vision, delegate).then((ok) => {
    if (roundPhase === ROUND_PHASE.WAITING_FOR_BOTH) {
      setCamStatus("请双手入镜");
      $("note").textContent = ok && camReady
        ? "双手同时入镜后开课。无摄像头可按 F/J 调试。"
        : "开摄像头后须双手入镜；也可无摄像头按 F/J 调试。";
      return;
    }
    if (roundPhase === ROUND_PHASE.ACTIVE) return;
    $("note").textContent = ok
      ? "姿态与手模已就绪（" + delegate + "）。日课可直接开始；开摄像头后须双手入镜。"
      : "姿态已就绪，手模未加载。日课可按 F/J 或触控演示。";
  }).catch((err) => console.warn("hand", err));
}

async function initHand(vision, preferredDelegate) {
  if (handLandmarker) return true;
  if (handFailed) return false;
  if (!HandLandmarker || !vision) {
    handFailed = true;
    return false;
  }
  if (handLoading) return handLoading;
  const token = handToken;
  const job = (async () => {
    const modelCandidates = [
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      new URL("./mediapipe/hand_landmarker.task", import.meta.url).href,
    ];
    const first = preferredDelegate === "GPU" ? "GPU" : "CPU";
    const delegates = [first, first === "CPU" ? "GPU" : "CPU"];
    let lastErr = null;
    for (const model of modelCandidates) {
      for (const delegate of delegates) {
        if (token !== handToken) return false;
        try {
          const created = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: model, delegate },
            runningMode: "VIDEO",
            numHands: 2,
          });
          if (token !== handToken) {
            if (created && created.close) {
              try { created.close(); } catch (err) { console.warn(err); }
            }
            return false;
          }
          handLandmarker = created;
          console.log("hand ok", { model, delegate });
          return true;
        } catch (e) {
          lastErr = e;
          console.warn("hand fail", model, delegate, e);
        }
      }
    }
    if (token === handToken) {
      handFailed = true;
      console.warn("hand present unavailable", lastErr);
    }
    return false;
  })();
  handLoading = job;
  try {
    return await job;
  } finally {
    if (handLoading === job) handLoading = null;
  }
}

/** 落点由招形决定：冲打右上靶区，膀打中桩靶区 */
function impactPoint(move) {
  const el = move && $(move.armId);
  const dot = el && el.querySelector(".hit-pt");
  const stage = document.querySelector(".stage");
  if (!dot || !stage) return null;
  const dr = dot.getBoundingClientRect();
  const sr = stage.getBoundingClientRect();
  if (sr.width < 2 || sr.height < 2) return null;
  return {
    x: (dr.left + dr.width / 2 - sr.left) / sr.width,
    y: (dr.top + dr.height / 2 - sr.top) / sr.height,
  };
}

/** 视觉反馈：靶臂闪光 + 冲击光圈 + 音字 + 轻抖。只做画面，不动判定。 */
function flash(move) {
  const cur = move;
  $("flash").className = "flash ok";
  const s = $("sfx");
  s.textContent = cur.ok;
  s.classList.remove("show");
  void s.offsetWidth;
  s.classList.add("show");

  const pt = impactPoint(cur);
  if (pt) {
    s.style.setProperty("--sfx-x", `${pt.x * 100}%`);
    s.style.setProperty("--sfx-y", `${pt.y * 100}%`);
  }

  const arm = $(cur.armId);
  if (arm) arm.classList.add("hit");
  const ring = $("impact");
  if (ring && pt) {
    ring.style.left = `${pt.x * 100}%`;
    ring.style.top = `${pt.y * 100}%`;
    ring.classList.remove("fire");
    ring.classList.toggle("cool", cur.sil === "bong");
    void ring.offsetWidth;
    ring.classList.add("fire");
  }
  const stage = document.querySelector(".stage");
  if (stage) {
    stage.classList.remove("shake");
    void stage.offsetWidth;
    stage.classList.add("shake");
  }

  setTimeout(() => {
    $("flash").className = "flash";
    $("armRU").classList.remove("hit");
    $("armMid").classList.remove("hit");
    const el = document.querySelector(".stage");
    if (el) el.classList.remove("shake");
  }, 220);
}

// 待触发的视觉反馈：判定即时，画面等手到达靶区
const CONTACT_PUSH = 0.97; // 与 laneHand 的吸附阈值一致：触发瞬间掌心正好压在靶点
const CONTACT_FALLBACK_MS = 260;
let pendingImpact = null;

function armPushOf(side) {
  return handViewState.pushOf(side);
}

function armReached(side) {
  if (!side) return true;
  const host = $("handOverlay");
  // need_both 阶段不画手，没人会到达：直接走兜底
  if (host && host.dataset.hands === "need_both") return false;
  return armPushOf(side) >= CONTACT_PUSH;
}

function flushPendingImpact(now) {
  if (!pendingImpact) return;
  const reached = armReached(pendingImpact.side);
  if (reached || now - pendingImpact.t0 >= CONTACT_FALLBACK_MS) {
    const { move } = pendingImpact;
    pendingImpact = null;
    flash(move);
  }
}

function onHitValid(shape, side) {
  const now = performance.now();
  if (now - lastHitAt < POST_HIT_COOLDOWN) return;
  const move = moveOfShape(shape);
  if (!move) return;
  lastHitAt = now;
  holdKey = null;
  holdCount = 0;
  holdAccum = 0;
  holdLastTs = 0;
  // 判定和推进即时执行；画面反馈挂起，等这只手落到靶区
  hits.push({ move: MOVE_ID_OF_SHAPE[shape], side });
  armLock[side] = shape;
  pendingImpact = { move, side, t0: now };
  handViewState.onHitOk();
  setCountDetail("识别：ok");
  applyHitVisual();
  if (hits.length >= HIT_GOAL) {
    finish(true);
    return;
  }
  if (armReached(side)) flushPendingImpact(now);
  showBanner("冷却中 · 0.5 秒后可下一击", 1200);
}

function setHoldUI(on, sil, sec, pct) {
  const track = $("holdTrack");
  const bar = $("holdBar");
  const meta = $("holdMeta");
  if (!track || !bar) return;
  if (!on) {
    track.classList.remove("show");
    if (meta) meta.classList.remove("show");
    bar.style.width = "0%";
    bar.style.display = "none";
    return;
  }
  track.classList.add("show");
  bar.style.display = "block";
  bar.className = "hold-bar " + (sil || "punch");
  bar.style.width = Math.max(0, Math.min(100, pct)) + "%";
  if (meta) {
    meta.classList.add("show");
    const name = sil === "bong" ? "膀态维持中" : "冲态维持中";
    meta.textContent = name + " " + sec.toFixed(1) + "/1s · " + Math.round(pct) + "%";
  }
}

function resetHold() {
  holdKey = null;
  holdCount = 0;
  holdAccum = 0;
  holdLastTs = 0;
}

function applyCandidate(c) {
  if (roundPhase !== ROUND_PHASE.ACTIVE) return;
  const now = performance.now();
  const label = c.shape + (c.detail ? ` ${c.detail}` : "");
  setCountDetail("识别：" + c.shape + "/" + c.quality);

  if (c.quality === "lost") {
    lostStreak += 1;
    resetHold();
    if (lostStreak >= LOST_FRAMES) {
      setPaused(true);
      setCamStatus("回到框内");
    } else {
      setCamStatus("识别中…");
    }
    return;
  }
  lostStreak = 0;
  if (posePaused) setPaused(false);

  if (hits.length >= HIT_GOAL) {
    if (captureTipAudience(label) !== "debug" || debugMode) setCamStatus(label);
    return;
  }

  const coolLeft = lastHitAt ? POST_HIT_COOLDOWN - (now - lastHitAt) : 0;
  if (coolLeft > 0) {
    setCamStatus("冷却中 " + (coolLeft / 1000).toFixed(1) + "s");
    resetHold();
    setHoldUI(false);
    return;
  }

  if (c.shape === "unknown") {
    if (holdAccum > 0) showBanner("保持姿势", 800);
    resetHold();
    setHoldUI(false);
    setCamStatus(label);
    return;
  }

  const move = moveOfShape(c.shape);
  const key = c.side + c.shape;
  const sameKey = holdKey === key;

  // 路径 B：ok 或 near 均可蓄 1s 维持
  if (c.quality === "ok" || c.quality === "near") {
    holdAccum = sameKey && holdLastTs ? holdAccum + (now - holdLastTs) : 0;
    holdKey = key;
    holdLastTs = now;
    const sec = Math.min(HOLD_PASS_MS / 1000, holdAccum / 1000);
    const pct = Math.floor((holdAccum / HOLD_PASS_MS) * 100);
    const tag = move.sil === "punch" ? "冲态维持中" : "膀态维持中";
    setHoldUI(true, move.sil, sec, pct);
    setCamStatus(tag + " " + sec.toFixed(1) + "/1s · " + pct + "%");
    setCountDetail(tag + " " + pct + "%");
    if (holdAccum >= HOLD_PASS_MS) {
      setHoldUI(false);
      onHitValid(c.shape, c.side);
      return;
    }
  } else {
    holdAccum = 0;
    holdLastTs = 0;
  }

  // 路径 A：瞬时 ok + 短去抖
  if (c.quality === "ok") {
    holdCount = sameKey ? holdCount + 1 : 1;
    if (holdCount >= HOLD_FRAMES) {
      setHoldUI(false);
      onHitValid(c.shape, c.side);
      return;
    }
  }

  if (c.quality === "near" && holdAccum <= 0) {
    showBanner("再送一寸", 500);
  }
}


function predictLoop() {
  try {
    const video = $("video");
    if (poseLandmarker && camReady && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const syncTs = nextSyncTs(performance.now());
      const result = poseLandmarker.detectForVideo(video, syncTs);
      const lm = result && result.landmarks && result.landmarks[0];
      let handPackets = null;
      if (roundPhase === ROUND_PHASE.WAITING_FOR_BOTH && handLandmarker) {
        handPackets = detectHandPackets(video, syncTs);
        if (findBothHands(handPackets)) beginRound();
      }
      const active = roundPhase === ROUND_PHASE.ACTIVE && hits.length < HIT_GOAL;
      const candidate = lm ? classifyPose(lm, active) : lostCandidate("无人");
      if (roundPhase === ROUND_PHASE.ACTIVE) {
        handViewState.setPoseDrive(candidate.side, candidate.shape, candidate.quality);
        applyCandidate(candidate);
      }
      handViewState.onHoldProgress(
        roundPhase === ROUND_PHASE.ACTIVE && holdAccum > 0 ? holdAccum / HOLD_PASS_MS : 0
      );

      const canvas = $("overlayCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // 摄像头小窗按两臂画关节点，自由击桩两只手都可能出招
      if (lm) {
        for (const side of ["L", "R"]) {
          const arm = armOf(lm, side);
          if (!armVisible(arm)) continue;
          ctx.fillStyle = "rgba(232,215,195,0.85)";
          for (const p of [arm.sh, arm.el, arm.wr]) {
            ctx.beginPath();
            ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.strokeStyle = "rgba(232,90,42,0.7)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(arm.sh.x * canvas.width, arm.sh.y * canvas.height);
          ctx.lineTo(arm.el.x * canvas.width, arm.el.y * canvas.height);
          ctx.lineTo(arm.wr.x * canvas.width, arm.wr.y * canvas.height);
          ctx.stroke();
        }
      }
      if (handPackets && roundPhase === ROUND_PHASE.WAITING_FOR_BOTH) {
        ctx.fillStyle = "#3aa0c8";
        for (let i = 0; i < handPackets.length; i++) {
          const wpt = handPackets[i] && handPackets[i].lm && handPackets[i].lm[0];
          if (!wpt || wpt.x == null || wpt.y == null) continue;
          ctx.beginPath();
          ctx.arc(wpt.x * canvas.width, wpt.y * canvas.height, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  } catch (err) {
    console.error(err);
  }
  try {
    handViewState.paintStage(roundPhase !== ROUND_PHASE.WAITING_FOR_BOTH);
  } catch (err) {
    console.error(err);
  }
  requestAnimationFrame(predictLoop);
}

function beginRound() {
  if (roundPhase === ROUND_PHASE.ACTIVE) return;
  setRoundPhase(ROUND_PHASE.ACTIVE);
  if (roundPhase !== ROUND_PHASE.ACTIVE) return;
  $("instr").textContent = "自由击桩 · 左右手可打任意桩手。1 分钟内有效击满 10 次；维持 1 秒或瞬时有效均可过；击后冷却 0.5 秒。";
  applyHitVisual();
}

async function start() {
  resetIdle();
  if (mode === "drill" && !camReady) {
    $("btnStrike").disabled = false;
    setCamStatus("调试·无摄像头");
    $("note").textContent = "无摄像头可按 F/J 调试：F=左手冲拳，J=右手膀手；也可用触控演示。";
    showBanner("调试开课 · F/J", 1400);
    beginRound();
    try { await initPose(); } catch (e) { console.error(e); }
    return;
  }
  const okCam = await ensureCamera();
  if (!okCam && mode === "contest") {
    showBanner("比赛专用需摄像头，请先点「开启摄像头」", 2000);
    setCamStatus("待开启");
    return;
  }
  if (mode === "drill") {
    $("btnStrike").disabled = false;
    setCamStatus("请双手入镜");
    $("note").textContent = "双手同时入镜后开课。无摄像头可按 F/J 调试。";
    showBanner("请双手入镜", 1600);
    setRoundPhase(ROUND_PHASE.WAITING_FOR_BOTH);
  }
  try { await initPose(); }
  catch (e) {
    const msg = (e && (e.message || String(e))) || "未知错误";
    if (!poseLandmarker) {
      setCamStatus("模型失败");
      $("note").textContent = "姿态模型加载失败：" + msg + "。日课可按 F/J 或触控演示；可点「重试模型」。";
    }
    console.error(e);
  }
  if (handLoading) {
    try {
      await Promise.race([
        handLoading,
        new Promise((resolve) => setTimeout(resolve, 2500)),
      ]);
    } catch (err) { console.warn(err); }
  }
  if (mode === "drill") {
    setCamStatus("请双手入镜");
    $("note").textContent = okCam && handLandmarker
      ? "双手同时入镜后开课。触控演示／F／J 可不经双手门。"
      : "双手入镜后开课；也可关摄像头用 F/J 调试。";
    return;
  }
  beginRound();
}

function finish(pass) {
  setRoundPhase(ROUND_PHASE.FINISHED);
  setPaused(false);
  $("hud").classList.remove("urgent");
  $("armRU").className = "arm ru";
  $("armMid").className = "arm mid";
  const contest = mode === "contest";
  $("resultTitle").textContent = pass
    ? (contest ? "咏春比赛专用 · 达成" : "过关。下一课。")
    : (contest ? "咏春比赛专用 · 未达成" : "再来一课。");
  const seqText = hits.length
    ? hits.map((hit) => MOVES[hit.move].short).join("、")
    : "—";
  $("resultBody").textContent =
    `完成 ${hits.length}/${HIT_GOAL} · 剩余 ${Math.ceil(left)}s · 序列：${seqText}`;
  $("overlay").classList.add("show");
}

/** 触控与 F／J 的脉冲：左手冲、右手膀 */
function pulseSide(side, shape) {
  if (side) handViewState.pulse(side, shape);
}

function tryKeyDrive(shape, side) {
  if (mode === "contest" || hits.length >= HIT_GOAL) return;
  if ($("overlay").classList.contains("show")) return;
  pulseSide(side, shape);
  if (roundPhase !== ROUND_PHASE.ACTIVE) beginRound();
  onHitValid(shape, side);
}

function tryTapFallback() {
  if (mode === "contest" || hits.length >= HIT_GOAL) return;
  if (roundPhase !== ROUND_PHASE.ACTIVE) beginRound();
  const tap = nextTapMove();
  pulseSide(tap.side, MOVES[tap.move].shape);
  onHitValid(MOVES[tap.move].shape, tap.side);
}

$("btnMode").onclick = () => {
  mode = mode === "drill" ? "contest" : "drill";
  setModeUI();
};
$("btnStart").onclick = () => { start(); };
$("btnAgain").onclick = () => { start(); };
async function openCameraFromClick() {
  const ok = await ensureCamera();
  if (!ok) return;
  if (!handLandmarker) handFailed = false;
  try { await initPose(); } catch (e) { console.error(e); }
}

$("btnCamDock").onclick = () => { openCameraFromClick(); };
$("btnStrike").onclick = tryTapFallback;

window.addEventListener("keydown", (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === "f") {
    e.preventDefault();
    tryKeyDrive("straight", "L");
  } else if (k === "j") {
    e.preventDefault();
    tryKeyDrive("bridge", "R");
  } else if (k === "d") {
    e.preventDefault();
    setDebugMode(!debugMode);
  }
});

resetIdle();
setCamStatus("待开启 · 日课可直接开始");
$("note").textContent = secureHint() || "日课可直接开始（F=冲／J=膀）；开摄像头后须双手入镜（HTTPS／localhost）";

$("btnRetryModel") && ($("btnRetryModel").onclick = () => {
  if (handLandmarker && handLandmarker.close) {
    try { handLandmarker.close(); } catch (err) { console.warn(err); }
  }
  handToken += 1;
  handLandmarker = null;
  handFailed = false;
  handLoading = null;
  poseLandmarker = null;
  poseLoading = null;
  PoseLandmarker = null;
  HandLandmarker = null;
  FilesetResolver = null;
  initPose().then(() => showBanner(handLandmarker ? "姿态与手模已就绪" : "姿态已就绪", 1000)).catch((e) => {
    showBanner("模型仍失败", 1400);
    console.error(e);
  });
});

predictLoop();
(async () => {
  try {
    if (window.isSecureContext) await initPose();
  } catch (e) {
    console.error(e);
    const msg = (e && (e.message || String(e))) || "未知错误";
    setCamStatus("模型失败");
    $("note").textContent = "姿态模型预加载失败：" + msg + "。日课可用触控；可点「重试模型」或确认 mediapipe/ 同目录。";
  }
})();
</script>
</body>
</html>
