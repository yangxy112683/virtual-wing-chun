<!DOCTYPE html>
<!-- RELEASE_TAG: v1.0 | sample: drill-cam-v1.9 | hold=3s cooldown=2s dual-path TIME=60s -->
<!-- virtual-wing-chun H5-CAM sample | content=v1.9 | release-tag=v1.0 | 2026-11-04 -->
<!-- branch: cursor/h5-landscape-layout | landscape stage; pose owns hits -->

<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>虚拟咏春 · H5-CAM v1.0.1（Safari 可分享）</title>
<style>
  :root {
    --card: rgba(12, 10, 8, 0.82);
    --red: #c43c2e; --ok: #e8d7c3; --glow: #e85a2a; --glow2: #3aa0c8;
    --rail: 28vmin;
    --dummy-w: 46%;
    --dummy-h: 76%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #0d0b09; color: var(--ok);
    font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .phone {
    width: 100%; max-width: 420px; margin: 0 auto; min-height: 100dvh; height: 100%;
    position: relative; overflow: hidden; display: block;
    background:
      radial-gradient(ellipse at 50% 35%, #5a4030 0%, transparent 55%),
      linear-gradient(180deg, #2a1c14 0%, #12100e 55%, #0a0908 100%);
  }
  .stage-col, .rail, .arm-side { display: contents; }
  .cam-wrap {
    position: absolute; left: 10px; top: 156px; width: 104px; height: 128px;
    z-index: 6; border-radius: 10px; overflow: hidden;
    background: #000; border: 2px solid rgba(232,215,195,0.55);
  }
  .cam-wrap.lost { border-style: dashed; border-color: rgba(232,215,195,0.35); }
  .cam-wrap video, .cam-wrap canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1);
  }
  .cam-wrap canvas { pointer-events: none; }
  .cam-status {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    font-size: 9px; text-align: center; padding: 3px 2px;
    background: rgba(0,0,0,0.65); color: rgba(232,215,195,0.85);
  }
  .topbar {
    position: absolute; top: 8px; left: 0; right: 0; text-align: center;
    font-size: 11px; letter-spacing: 0.18em; color: rgba(232,215,195,0.35); z-index: 8;
  }
  .topbar:empty { display: none; }
  .topbar.contest { color: rgba(196,60,46,0.85); }
  .hud {
    position: absolute; top: 28px; right: 10px; left: 10px; z-index: 8;
    background: var(--card); border: 1px solid rgba(196,60,46,0.55);
    border-radius: 12px; padding: 8px 10px 10px; pointer-events: none;
    display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: start;
  }
  .hud.urgent { box-shadow: 0 0 0 1px var(--red); }
  .timer-wrap { width: 52px; height: 52px; position: relative; }
  .timer-wrap svg { width: 52px; height: 52px; transform: rotate(-90deg); }
  .timer-wrap .t {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .hud-main { min-width: 0; }
  .step-tag { font-size: 14px; font-weight: 700; color: #fff; }
  .step-tag.punch { color: #ffb089; }
  .step-tag.bong { color: #8fd3ef; }
  .instr { font-size: 10px; line-height: 1.35; color: #f0e6da; margin-top: 2px; }
  .count { font-size: 12px; margin-top: 2px; opacity: 0.85; }
  .seq {
    position: static; margin-top: 6px;
    display: flex; flex-wrap: wrap; gap: 3px; pointer-events: none;
  }
  .seq span {
    width: 20px; height: 20px; border-radius: 5px; font-size: 9px; font-weight: 700;
    display: grid; place-items: center; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.12); color: rgba(232,215,195,0.45);
  }
  .seq span.punch { border-color: rgba(232,90,42,0.45); }
  .seq span.bong { border-color: rgba(58,160,200,0.45); }
  .seq span.done { background: rgba(232,215,195,0.2); color: var(--ok); }
  .seq span.cur.punch { background: rgba(232,90,42,0.35); color: #fff; border-color: var(--glow); }
  .seq span.cur.bong { background: rgba(58,160,200,0.35); color: #fff; border-color: var(--glow2); }

  .stage { position: absolute; inset: 0; }
  .dummy {
    position: absolute; left: 58%; top: 54%; transform: translate(-50%, -50%);
    width: min(58vw, 220px); height: min(78vw, 300px);
  }
  .pole {
    position: absolute; left: 50%; top: 8%; bottom: 12%; width: 26px; margin-left: -13px;
    border-radius: 6px; background: linear-gradient(90deg, #4a3024, #6b4634 40%, #3a241c);
  }
  .arm, .leg {
    position: absolute; border-radius: 9px;
    background: linear-gradient(180deg, #6b4634, #3a241c);
  }
  .arm.lu { width: 70px; height: 16px; left: 26%; top: 18%; transform: rotate(12deg); }
  .arm.ru { width: 70px; height: 16px; left: 56%; top: 16%; transform: rotate(-8deg); }
  .arm.mid { width: 70px; height: 18px; left: 50%; top: 38%; transform: rotate(-4deg); }
  .leg { width: 14px; height: 64px; left: 58%; top: 58%; transform: rotate(18deg); }
  .arm.target-punch {
    outline: 3px solid var(--glow); box-shadow: 0 0 12px rgba(232,90,42,0.55);
    animation: blink 1s ease infinite; z-index: 2;
  }
  .arm.target-bong {
    outline: 3px solid var(--glow2); box-shadow: 0 0 12px rgba(58,160,200,0.55);
    animation: blink2 1s ease infinite; z-index: 2;
  }
  .arm.hit { filter: brightness(1.35); }
  @keyframes blink { 50% { outline-color: rgba(232,90,42,0.2); } }
  @keyframes blink2 { 50% { outline-color: rgba(58,160,200,0.2); } }

  .demo-card {
    position: absolute; bottom: calc(148px + env(safe-area-inset-bottom, 0px)); right: 10px;
    width: min(28vw, 136px); max-width: 136px;
    padding: 7px 8px 8px; border-radius: 12px;
    background: rgba(12,14,18,0.55); border: 1.5px solid rgba(232,90,42,0.75);
    box-shadow: 0 6px 16px rgba(0,0,0,0.28);
    pointer-events: none !important; z-index: 3;
    transition: box-shadow 0.2s, border-color 0.2s, background 0.2s;
  }
  .demo-card.ok-flash {
    border-color: #3ecf7a;
    background: rgba(20,40,28,0.72);
    box-shadow: 0 0 0 2px rgba(62,207,122,0.45), 0 6px 16px rgba(0,0,0,0.28);
  }
  .demo-label {
    font-size: 10px; letter-spacing: 0.08em; color: var(--glow);
    font-weight: 700; margin-bottom: 2px;
  }
  .demo-cmd {
    font-size: 13px; font-weight: 700; color: #f3ebe0; margin-bottom: 2px;
  }
  .demo-hint {
    margin-top: 4px; font-size: 10px; line-height: 1.3;
    color: rgba(232,215,195,0.78);
  }
  .sil {
    position: relative; width: 100%; height: 86px; margin: 0 auto;
    opacity: 0.92;
  }
  .sil svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .sil .fig { fill: none; stroke: rgba(232,215,195,0.8); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .sil .ghost { stroke: rgba(232,215,195,0.22); stroke-width: 2; stroke-dasharray: 3 4; fill: none; }
  .sil .pose-punch, .sil .pose-bong { display: none; }
  .sil.punch .pose-punch { display: block; }
  .sil.bong .pose-bong { display: block; }
  /* 冲：蓄—斜上伸臂到位—停 0.35s ≈ 1.0s */
  .sil.punch .pose-punch .arm-line {
    transform-box: fill-box; transform-origin: 42px 48px;
    animation: punchLoop 1s ease-in-out infinite;
  }
  .sil.punch .pose-punch .fist {
    transform-box: fill-box; transform-origin: center;
    animation: punchLoop 1s ease-in-out infinite;
  }
  .sil.punch .pose-punch .glow-dot {
    animation: punchGlow 1s ease-in-out infinite;
  }
  @keyframes punchLoop {
    0%, 8% { transform: translate(-10px, 6px) scale(0.92); }
    42% { transform: translate(0, 0) scale(1); }
    77%, 100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes punchGlow {
    0%, 35% { opacity: 0.15; }
    45%, 80% { opacity: 1; }
    100% { opacity: 0.35; }
  }
  /* 膀：斜下伸臂—停 0.35s ≈ 1.0s */
  .sil.bong .pose-bong .bridge {
    transform-box: fill-box; transform-origin: 46px 56px;
    animation: bongLoop 1s ease-in-out infinite;
  }
  .sil.bong .pose-bong .glow-bridge {
    animation: punchGlow 1s ease-in-out infinite;
  }
  @keyframes bongLoop {
    0%, 10% { transform: rotate(14deg) translateY(4px); }
    45% { transform: rotate(0) translateY(0); }
    80%, 100% { transform: rotate(0) translateY(0); }
  }
  .sil.strike { filter: drop-shadow(0 0 6px rgba(62,207,122,0.85)); }

  .sfx {
    position: absolute; left: 58%; top: 42%; transform: translate(-50%,-50%);
    font-size: 22px; font-weight: 700; opacity: 0; pointer-events: none; z-index: 9;
    text-shadow: 0 2px 8px #000;
  }
  .sfx.show { animation: pop 0.4s ease forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%,-40%) scale(0.85); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-75%) scale(1.1); }
  }
  .flash { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .flash.ok { background: rgba(232,215,195,0.07); }
  .flash.bad { background: rgba(120,120,120,0.12); }
  .banner {
    position: absolute; left: 50%; top: 48%; transform: translate(-50%,-50%);
    z-index: 9; font-size: 13px; padding: 6px 12px; border-radius: 8px;
    background: rgba(0,0,0,0.7); color: var(--ok); opacity: 0; pointer-events: none;
  }
  .banner.show { opacity: 1; }

  .bottom-chrome {
    position: absolute; left: 10px; right: 10px;
    bottom: max(10px, env(safe-area-inset-bottom, 0px));
    z-index: 10; display: flex; flex-direction: column; gap: 6px;
  }
  .note {
    position: static; margin: 0; padding: 0 2px;
    font-size: 11px; line-height: 1.35; color: rgba(232,215,195,0.55); text-align: center;
  }
  .dock-tools {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  }
  .dock-main {
    display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px;
  }
  .bottom-chrome button {
    border: 0; border-radius: 10px; padding: 11px 6px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .dock-tools button { padding: 9px 4px; font-size: 12px; }
  .ghost { background: rgba(255,255,255,0.08); color: var(--ok); }
  .primary { background: var(--red); color: #fff; }
  .strike-btn { background: #2a6f8f; color: #fff; }
  .strike-btn:disabled, .strike-btn.hidden { opacity: 0.35; }
  .strike-btn.hidden { visibility: hidden; }
  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.62);
    display: none; align-items: center; justify-content: center; z-index: 20; padding: 24px;
  }
  .overlay.show { display: flex; }
  .card {
    width: 100%; max-width: 300px; background: #1c1612; border-radius: 16px;
    padding: 20px; border: 1px solid rgba(196,60,46,0.4); text-align: center;
  }
  .card h2 { font-size: 20px; margin-bottom: 8px; }
  .card p { font-size: 13px; color: rgba(232,215,195,0.75); line-height: 1.5; margin-bottom: 16px; }
  .card button { width: 100%; border: 0; border-radius: 10px; padding: 12px; background: var(--red); color: #fff; font-weight: 600; margin-top: 8px; }
  .card .ghost-btn { background: rgba(255,255,255,0.1); }

  .hold-track {
    margin-top: 6px; height: 8px; border-radius: 99px;
    background: rgba(255,255,255,0.1); overflow: hidden;
    display: none;
  }
  .hold-track.show { display: block; }
  .hold-bar {
    height: 100%; width: 0%; border-radius: 99px;
    transition: width 0.05s linear;
  }
  .hold-bar.punch { background: linear-gradient(90deg, #e85a2a, #ffb080); }
  .hold-bar.bong { background: linear-gradient(90deg, #3aa0c8, #9ad8ef); }
  .hold-meta {
    margin-top: 3px; font-size: 10px; color: rgba(232,215,195,0.75);
    display: none;
  }
  .hold-meta.show { display: block; }

  .hand-overlay {
    position: absolute;
    left: 0;
    right: 0;
    height: 30%;
    bottom: calc(148px + env(safe-area-inset-bottom, 0px));
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .hand-overlay canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .hand-tag {
    position: absolute;
    left: 12px;
    right: auto;
    top: auto;
    bottom: calc(156px + env(safe-area-inset-bottom, 0px));
    width: max-content;
    max-width: 42%;
    z-index: 7;
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #f3ebe0;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85);
    pointer-events: none;
  }
  .hand-tag.cun { color: #ffd78a; }
  .hand-tag.need { color: #ffb089; }
  .hand-tag.lost { color: rgba(232,215,195,0.78); }

  @media (orientation: landscape) and (min-height: 640px) {
    .phone {
      max-width: none; width: 100%; margin: 0; height: 100dvh; min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--rail);
      grid-template-rows: minmax(0, 1fr);
      background:
        radial-gradient(ellipse at 42% 48%, #5a4030 0%, transparent 52%),
        linear-gradient(180deg, #2a1c14 0%, #12100e 55%, #0a0908 100%);
    }
    .stage-col {
      display: block; position: relative; min-width: 0; min-height: 0; height: 100%;
      overflow: hidden;
    }
    .rail {
      display: flex; flex-direction: column; gap: 6px;
      min-width: 0; height: 100%; position: relative;
      padding: 8px;
      padding-right: max(8px, env(safe-area-inset-right));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      overflow: auto; z-index: 8;
      background: rgba(8, 6, 5, 0.55);
      border-left: 1px solid rgba(232, 215, 195, 0.14);
    }
    .overlay { grid-column: 1 / -1; grid-row: 1; }
    .cam-wrap {
      left: max(10px, env(safe-area-inset-left));
      top: auto;
      bottom: max(10px, env(safe-area-inset-bottom));
      width: min(132px, 22%); height: min(96px, 24%);
    }
    .topbar { position: static; left: auto; right: auto; top: auto; letter-spacing: 0.14em; }
    .hud {
      position: static; top: auto; right: auto; left: auto; z-index: auto;
      padding: 8px;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 4px 6px; align-items: center;
    }
    .hud-main { display: contents; }
    .timer-wrap { width: 44px; height: 44px; grid-column: 1; grid-row: 2; }
    .timer-wrap svg { width: 44px; height: 44px; }
    .step-tag { grid-column: 1 / -1; grid-row: 1; font-size: 15px; line-height: 1.25; }
    .count { grid-column: 2; grid-row: 2; }
    .instr { grid-column: 1 / -1; grid-row: 3; }
    .hold-track { grid-column: 1 / -1; grid-row: 4; }
    .hold-meta { grid-column: 1 / -1; grid-row: 5; }
    .seq { grid-column: 1 / -1; grid-row: 6; }
    .seq span { width: 16px; height: 16px; border-radius: 4px; }
    .dummy {
      left: calc(58% - var(--dummy-w) / 2);
      top: calc(50% - var(--dummy-h) / 2);
      width: var(--dummy-w); height: var(--dummy-h);
      transform: none; z-index: 4;
    }
    .arm-side {
      display: block; position: absolute; z-index: 6; overflow: visible; pointer-events: none;
      left: calc(58% - var(--dummy-w) / 2);
      top: calc(50% - var(--dummy-h) / 2);
      width: var(--dummy-w); height: var(--dummy-h);
    }
    .pole { width: 9%; margin-left: 0; transform: translateX(-50%); }
    .arm.lu, .arm.ru { width: 32%; height: 5.6%; }
    .arm.mid { width: 32%; height: 6.2%; }
    .leg { width: 5%; height: 22%; }
    .arm.target-punch, .arm.target-bong { outline-width: 4px; }
    .demo-card {
      position: static; right: auto; bottom: auto; flex: 0 1 auto;
      width: 100%; max-width: none; z-index: auto; box-shadow: none;
      padding: 6px 8px 7px;
    }
    .sil { height: 72px; }
    .sfx {
      left: 0; top: 22%; transform: translate(-108%, -50%);
      font-size: clamp(18px, 3vmin, 28px); z-index: 2;
    }
    .sfx.show { animation: popWide 0.4s ease forwards; }
    .flash { z-index: 5; }
    .banner {
      top: 8px; transform: translateX(-50%);
      max-width: calc(100% - 24px); z-index: 7;
    }
    .bottom-chrome { position: static; left: auto; right: auto; bottom: auto; z-index: auto; }
    .dock-tools { grid-template-columns: 1fr; }
    .dock-main { grid-template-columns: 1fr; gap: 6px; }
    .bottom-chrome button { padding: 8px 6px; }
    .dock-tools button { padding: 7px 4px; }
    .hand-overlay { height: 34%; bottom: 0; }
    .hand-tag, .hand-tag.need, .hand-tag.lost {
      position: fixed;
      left: max(12px, env(safe-area-inset-left));
      right: auto;
      top: 10px;
      bottom: auto;
      width: max-content;
      max-width: 240px;
      text-align: left;
      font-size: 16px;
      z-index: 7;
    }
    .hand-tag.cun {
      position: absolute;
      left: 91%;
      top: 15%;
      bottom: auto;
      width: max-content;
      max-width: none;
      font-size: 20px;
      white-space: nowrap;
      z-index: 2;
      color: #ffd78a;
    }
    .stage:has(.arm.target-bong) .hand-tag.cun { top: 37%; left: 85%; }
  }
  @keyframes popWide {
    0% { opacity: 0; transform: translate(-108%, -28%) scale(0.85); }
    30% { opacity: 1; transform: translate(-108%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-108%, -92%) scale(1.08); }
  }
</style>
</head>
<body>
<div class="phone">
  <div class="stage-col">
    <div class="cam-wrap" id="camWrap">
      <video id="video" playsinline webkit-playsinline muted autoplay></video>
      <canvas id="overlayCanvas"></canvas>
      <div class="cam-status" id="camStatus">摄像头未开</div>
    </div>

    <div class="stage">
      <div class="hand-overlay" id="handOverlay">
        <canvas id="handCanvas" aria-hidden="true"></canvas>
      </div>
      <div class="dummy">
        <div class="pole"></div>
        <div class="arm lu" id="armLU"></div>
        <div class="arm ru" id="armRU"></div>
        <div class="arm mid" id="armMid"></div>
        <div class="leg"></div>
      </div>
      <div class="arm-side">
        <div class="hand-tag" id="handTag" hidden role="status"></div>
        <div class="sfx" id="sfx"></div>
      </div>
      <div class="flash" id="flash"></div>
      <div class="banner" id="banner"></div>
    </div>
  </div>

  <aside class="rail">
    <div class="topbar" id="topbar"></div>
    <div class="hud" id="hud">
      <div class="timer-wrap">
        <svg width="44" height="44" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
          <circle id="ring" cx="32" cy="32" r="28" fill="none" stroke="#c43c2e" stroke-width="4"
            stroke-dasharray="175.93" stroke-dashoffset="0" stroke-linecap="round"/>
        </svg>
        <div class="t" id="timerText">10.0</div>
      </div>
      <div class="hud-main">
        <div class="step-tag punch" id="stepTag">第 1/10 击 · 日字冲拳（右上）</div>
        <div class="instr" id="instr">交错击桩 · 听指示换招。1 分钟内按序有效击 10 次；维持 3 秒或瞬时有效均可过；击后冷却 2 秒。</div>
        <div class="count" id="count">0 / 10 · 识别：—</div>
        <div class="hold-track" id="holdTrack"><div class="hold-bar punch" id="holdBar"></div></div>
        <div class="hold-meta" id="holdMeta"></div>
        <div class="seq" id="seq"></div>
      </div>
    </div>
    <div class="demo-card" id="demoCard" aria-label="成功示范">
      <div class="demo-label">成功示范</div>
      <div class="demo-cmd" id="demoCmd">斜上冲出</div>
      <div class="sil punch" id="sil">
        <svg viewBox="0 0 112 88" aria-hidden="true">
          <g class="ghost">
            <path d="M22 80 V40 Q22 24 38 20 H54"/>
            <circle cx="38" cy="12" r="7"/>
          </g>
          <!-- 冲：斜上出拳 -->
          <g class="pose-punch">
            <path class="fig" d="M42 36 L48 54 L52 76"/>
            <g class="arm-line">
              <path class="fig" d="M48 54 L90 18"/>
              <rect class="fist" x="86" y="8" width="16" height="14" rx="3" fill="rgba(232,90,42,0.92)"/>
              <circle class="glow-dot" cx="102" cy="12" r="4" fill="rgba(255,210,120,0.95)"/>
            </g>
          </g>
          <!-- 膀：斜下出拳 -->
          <g class="pose-bong">
            <path class="fig" d="M42 34 L46 48 L48 70"/>
            <g class="bridge">

    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm",

}

const P = "yat_ji_chung_kuen";
const B = "bong_sau";

const TIME_LIMIT = 60;

const MOVES = {

    name: "日字冲拳", short: "冲", shape: "straight", partLabel: "右上",
    armId: "armRU", ok: "笃", bad: "嗒", sil: "punch", targetClass: "target-punch",

  bong_sau: {

function angleDeg(a, b, c) {
  const ba = { x: a.x - b.x, y: a.y - b.y };
  const bc = { x: c.x - b.x, y: c.y - b.y };
  const dot = ba.x * bc.x + ba.y * bc.y;
  const m = Math.hypot(ba.x, ba.y) * Math.hypot(bc.x, bc.y) || 1e-6;
  return Math.acos(Math.min(1, Math.max(-1, dot / m))) * 180 / Math.PI;
}

function pickArm(lm) {
  // Prefer the more extended / higher-visibility arm (selfie: often right = index 12,14,16)
  const arms = [
    { sh: lm[12], el: lm[14], wr: lm[16], side: "R" },
    { sh: lm[11], el: lm[13], wr: lm[15], side: "L" },
  ];
  let best = null, bestScore = -1;
  for (const a of arms) {
    if (!a.sh || !a.el || !a.wr) continue;
    const vis = Math.min(a.sh.visibility ?? 1, a.el.visibility ?? 1, a.wr.visibility ?? 1);
    if (vis < 0.4) continue;
    const reach = Math.hypot(a.wr.x - a.sh.x, a.wr.y - a.sh.y);
    const score = vis * 2 + reach;
    if (score > bestScore) { bestScore = score; best = a; }
  }
  return best;
}

function inFrame(lm, arm) {
  // Soft margins — only shoulders+elbow must stay in; wrist tip may clip
  const core = [lm[11], lm[12], arm.sh, arm.el].filter(Boolean);
  const soft = [arm.wr].filter(Boolean);
  const coreOk = core.every((p) => p.x > 0.01 && p.x < 0.99 && p.y > 0.01 && p.y < 0.99);
  const softOk = soft.every((p) => p.x > -0.05 && p.x < 1.05 && p.y > -0.08 && p.y < 1.05);
  return coreOk && softOk;
}

/** Owner 放宽：冲＝斜向上出拳；膀＝斜向下出拳（画面 y 向下） */
function classifyPose(lm) {
  const arm = pickArm(lm);
  if (!arm) return { shape: "unknown", quality: "lost", confidence: 0, detail: "无人" };

  if (!inFrame(lm, arm)) {
    return { shape: "unknown", quality: "lost", confidence: 0, detail: "出画" };
  }

  const { sh, el, wr } = arm;
  const reach = Math.hypot(wr.x - sh.x, wr.y - sh.y);
  const foreshort = Math.abs((wr.z ?? 0) - (sh.z ?? 0));
  // 腕相对肩的竖直方向：<0 斜上，>0 斜下
  const dy = wr.y - sh.y;
  const dx = Math.abs(wr.x - sh.x);
  // 肘相对肩也可辅助：冲时常腕高于肘；膀时常腕低于肘
  const wristAboveElbow = wr.y < el.y - 0.01;
  const wristBelowElbow = wr.y > el.y + 0.01;

  // 未明显出拳（臂收在身侧）
  const MIN_REACH = 0.10;
  const MIN_EXT = Math.max(reach, foreshort * 1.2);
  if (MIN_EXT < MIN_REACH && dx < 0.06) {
    return { shape: "unknown", quality: "near", confidence: 0.15, detail: "未出招" };
  }

  // 冲：斜向上出拳（腕高于肩，或腕明显高于肘且前伸）
  let upScore = -1;
  if (dy < -0.02 || (wristAboveElbow && dy < 0.04)) {
    upScore =
      Math.max(0, -dy) / 0.18 +
      Math.min(0.5, reach / 0.28) +
      Math.min(0.35, foreshort * 2.5) +
      (wristAboveElbow ? 0.25 : 0);
  }

  // 膀：斜向下出拳（腕低于肩，或腕明显低于肘的前伸／斜落）
  let downScore = -1;
  if (dy > 0.02 || (wristBelowElbow && dy > -0.04)) {
    downScore =
      Math.max(0, dy) / 0.18 +
      Math.min(0.5, reach / 0.28) +
      Math.min(0.35, foreshort * 2.5) +
      (wristBelowElbow ? 0.25 : 0);
  }

  if (upScore < 0.2 && downScore < 0.2) {
    return { shape: "unknown", quality: "near", confidence: 0.2, detail: "方向不明" };
  }

  // 互斥接近：略偏一侧即可，阈值放宽
  if (upScore > 0 && downScore > 0 && Math.abs(upScore - downScore) < 0.12) {
    return { shape: "unknown", quality: "near", confidence: 0.3, detail: "上下接近" };
  }

  if (upScore >= downScore && upScore >= 0.28) {
    const conf = Math.min(0.98, 0.52 + upScore * 0.22);
    return {
      shape: "straight",
      quality: conf >= 0.58 ? "ok" : "near",
      confidence: conf,
      detail: `冲↑ dy=${dy.toFixed(2)}`,
    };
  }
  if (downScore > upScore && downScore >= 0.28) {
    const conf = Math.min(0.98, 0.52 + downScore * 0.22);
    return {
      shape: "bridge",
      quality: conf >= 0.58 ? "ok" : "near",
      confidence: conf,
      detail: `膀↓ dy=${dy.toFixed(2)}`,
    };
  }
  return { shape: "unknown", quality: "near", confidence: 0.25, detail: "弱特征" };
}

function pauseActive() {
  return posePaused || handGatePaused;
}

function notePauseEdge(was) {
  const nowOn = pauseActive();
  if (nowOn && !was) pauseAnchor = performance.now();
  if (!nowOn && was && running) endAt += performance.now() - pauseAnchor;
  paused = nowOn;
}

function setPaused(on) {
  if (on === posePaused) return;
  const was = pauseActive();
  posePaused = on;
  if (on) {
    $("camWrap").classList.add("lost");
    showBanner("回到框内", 1200);
  } else if (!handGatePaused) {
    $("camWrap").classList.remove("lost");
  }
  notePauseEdge(was);
}

function setHandGatePause(on) {
  if (on === handGatePaused) return;
  const was = pauseActive();
  handGatePaused = on;
  if (!on && !posePaused) $("camWrap").classList.remove("lost");
  notePauseEdge(was);
  if (on) {
    holdShape = null;
    holdCount = 0;
    holdAccum = 0;
    holdLastTs = 0;
    setHoldUI(false);
  }
}

function resetIdle() {
  step = 0; left = TIME_LIMIT; running = false; lastHitAt = 0; lastWrongAt = 0;
  holdShape = null; holdCount = 0; holdAccum = 0; holdLastTs = 0;
  posePaused = false; handGatePaused = false; paused = false;
  awaitBoth = false; handFollow = false;
  if (typeof handViewState !== "undefined" && handViewState.reset) handViewState.reset();
  setHoldUI(false);
  $("count").textContent = "0 / 10 · 识别：—";

  $("note").textContent = camReady
    ? "点开始；对着镜头按当前招出式（日课可用触控演示）"
    : "先开摄像头（需 HTTPS／本机服务），再点开始";
  cancelAnimationFrame(raf);
  $("camWrap").classList.remove("lost");
  applyStepVisual();
  setModeUI();
}

function tick() {
  if (!running) return;
  if (!paused) {
    left = Math.max(0, (endAt - performance.now()) / 1000);
  }
  $("timerText").textContent = Math.ceil(left);
  $("ring").style.strokeDashoffset = String(circum * (1 - left / TIME_LIMIT));
  $("hud").classList.toggle("urgent", left > 0 && left <= 3);
  if (left <= 0) return finish(false);
  raf = requestAnimationFrame(tick);
}

function secureHint() {
  if (!window.isSecureContext) {
    return "当前不是安全上下文（file:// 常被拦）。请用 localhost 或 HTTPS 打开后再点「开启摄像头」。";
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return "当前浏览器无法调摄像头。请用 Safari／Chrome，并用 HTTPS 或 localhost 打开（勿用 file://）。";
  }
  return "";
}

async function ensureCamera() {
  if (stream) return true;
  const hint = secureHint();
  if (hint) {
    camReady = false;
    $("camStatus").textContent = "需 HTTPS／localhost";
    showBanner("请用本机服务打开", 2200);
    $("note").textContent = hint;
    return false;
  }
  try {
    $("camStatus").textContent = "申请权限…";
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      });
    } catch (e1) {
      // Safari 常对 ideal 尺寸更严，降级再试
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: "user" } },
      });
    }
    const video = $("video");
    video.srcObject = stream;
    await video.play();
    camReady = true;
    $("camStatus").textContent = "识别中…";
    $("overlay").classList.remove("show");
    $("note").textContent = "点开始；对着镜头按当前招出式（日课可用触控演示）";
    if (!handLandmarker) handFailed = false;
    return true;
  } catch (err) {
    camReady = false;
    $("camStatus").textContent = "权限失败／待开启";
    showBanner("请允许摄像头后点「开启摄像头」", 2200);
    $("note").textContent = "浏览器未授权摄像头，或须 HTTPS／localhost；日课仍可用触控演示验证谱面。错误：" + (err && err.name ? err.name : "unknown");
    return false;
  }
}

async function initPose() {
  if (poseLandmarker) {
    if (!handLandmarker && !handFailed && visionSession) kickHand(visionSession.vision, visionSession.delegate);
    return poseLandmarker;
  }
  if (poseLoading) return poseLoading;
  $("camStatus").textContent = "加载识别模型…";
  $("note").textContent = "正在加载姿态模型（可先用触控演示开课）…";
  poseLoading = (async () => {
    if (!PoseLandmarker) {
      const src = await loadVisionLib();
      console.log("vision lib", src);
    }
    const wasmCandidates = [
      new URL("./mediapipe", import.meta.url).href,
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm",
      "https://unpkg.com/@mediapipe/tasks-vision@0.10.18/wasm",
    ];
    const modelCandidates = [
      new URL("./mediapipe/pose_landmarker_lite.task", import.meta.url).href,
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
    ];
    let lastErr = null;
    for (const wasm of wasmCandidates) {
      let vision;
      try {
        vision = await FilesetResolver.forVisionTasks(wasm);
      } catch (e) {
        lastErr = e;
        console.warn("wasm fail", wasm, e);
        continue;
      }
      for (const model of modelCandidates) {
        for (const delegate of ["CPU", "GPU"]) {
          try {
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
              baseOptions: { modelAssetPath: model, delegate },
              runningMode: "VIDEO",
              numPoses: 1,
            });
            console.log("pose ok", { wasm, model, delegate });
            visionSession = { vision, delegate };
            $("camStatus").textContent = camReady ? "识别待命" : "模型就绪·请开摄像头";
            if (!running) $("note").textContent = "姿态已就绪，正在加载手模。日课与触控演示可用。";
            kickHand(vision, delegate);
            return poseLandmarker;
          } catch (e) {
            lastErr = e;
            console.warn("model fail", model, delegate, e);
          }
        }
      }
    }
    const msg = (lastErr && (lastErr.message || String(lastErr))) || "未知错误";
    $("camStatus").textContent = "模型失败";
    $("note").textContent = "姿态模型加载失败：" + msg + "。请用本机服务打开并保留 mediapipe 文件夹；日课仍可用触控演示。";
    poseLoading = null;
    throw lastErr || new Error(msg);
  })();
  return poseLoading;
}

const PRESENT_MISS_GRACE_MS = 160;
const PRESENT_LOST_HOLD_MS = 480;
const PRESENT_LOST_FADE_MS = 1100;
const PRESENT_CUN_MS = 720;

function nextSyncTs(now) {
  const ts = now <= lastSyncTs ? lastSyncTs + 0.001 : now;
  lastSyncTs = ts;
  return ts;
}

function shapeToPresent(shape) {
  if (shape === "straight") return "punch_drive";
  if (shape === "bridge") return "bong_bridge";
  return "guard";
}

function wristAgrees(lm, shape) {
  if (!lm || !lm[0] || !lm[12]) return false;
  const dy = lm[12].y - lm[0].y;
  if (shape === "straight") return dy < -0.012;
  if (shape === "bridge") return dy > 0.012;
  return true;
}

function canonicalAngle(drawPose, imageSide) {
  if (drawPose === "guard") return -Math.PI / 2;
  if (drawPose === "punch_drive") return imageSide === "imageLeft" ? -0.78 : Math.PI + 0.78;
  return imageSide === "imageLeft" ? 0.78 : Math.PI - 0.78;
}

function resolveAngle(drawPose, lm, imageSide) {
  const base = canonicalAngle(drawPose, imageSide);
  if (drawPose === "guard" || !lm || !lm[0] || !lm[12]) return base;
  const shape = drawPose === "punch_drive" ? "straight" : "bridge";
  if (!wristAgrees(lm, shape)) return base;
  const obs = Math.atan2(lm[12].y - lm[0].y, lm[12].x - lm[0].x);
  let d = obs - base;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  if (Math.abs(d) > 1.05) return base;
  return base + d * 0.28;
}

function palmScale(lm) {
  const a = lm && lm[5];
  const b = lm && lm[17];
  if (!a || !b) return 1;
  const span = Math.hypot(a.x - b.x, a.y - b.y);
  if (!span) return 1;
  return Math.min(1.35, Math.max(0.75, span / 0.1));
}

const skinImg = { Left: new Image(), Right: new Image() };
skinImg.Left.src = new URL("./hand-skin-L.png", import.meta.url).href;
skinImg.Right.src = new URL("./hand-skin-R.png", import.meta.url).href;

function splitHands(packets) {
  let left = null;
  let right = null;
  const list = packets || [];
  for (let i = 0; i < list.length; i++) {
    const item = list[i];
    if (!item || !item.lm || !item.lm[0] || item.lm[0].x == null) continue;
    if (item.side === "Left" && (!left || item.score >= left.score)) left = item;
    if (item.side === "Right" && (!right || item.score >= right.score)) right = item;
  }
  if (!left && !right) {
    const bare = [];
    for (let i = 0; i < list.length; i++) {
      const item = list[i];
      if (item && item.lm && item.lm[0] && item.side !== "Left" && item.side !== "Right") bare.push(item);
    }
    if (bare.length >= 2) {
      bare.sort((a, b) => a.lm[0].x - b.lm[0].x);
      right = { lm: bare[0].lm, side: "Right", score: bare[0].score || 0 };
      left = { lm: bare[bare.length - 1].lm, side: "Left", score: bare[bare.length - 1].score || 0 };
    }
  }
  let presence = "need_both";
  if (left && right) presence = "both";
  else if (left) presence = "miss_right";
  else if (right) presence = "miss_left";
  return { presence, left, right };
}

function handLabel(action, presence, seenBoth, promptBoth, now, cunUntil) {
  if (cunUntil && now < cunUntil) return "寸劲到位";
  if (presence === "miss_left" || presence === "miss_right") return "请双手入镜";
  if (presence === "need_both" && (promptBoth || seenBoth)) {
    if (seenBoth && action === "lost") return "手模丢失，回到框内";
    return "请双手入镜";
  }
  if (action === "punch_drive" || action === "bong_bridge") return "手模跟手中";
  if (action === "lost" && seenBoth) return "手模丢失，回到框内";
  return "";
}

function palmTilt(drawPose, side) {
  if (drawPose === "punch_drive") return side === "Left" ? 0.22 : -0.22;
  if (drawPose === "bong_bridge") return side === "Left" ? -0.28 : 0.28;
  return 0;
}

function placeHand(hand, w, h) {
  let xNorm = 1 - hand.x;
  if (hand.side === "Left") xNorm = Math.min(xNorm, 0.36);
  if (hand.side === "Right") xNorm = Math.max(xNorm, 0.64);
  const pole = w * 0.58;
  let x = xNorm * w;
  const gap = w * 0.1;
  if (Math.abs(x - pole) < gap) x = x < pole ? pole - gap : pole + gap;
  const margin = Math.max(8, w * 0.04);
  x = Math.min(w - margin, Math.max(margin, x));
  const yNorm = Math.min(1, Math.max(0, hand.y));
  const y = h * (0.9 + 0.04 * yNorm);
  const angle = Math.PI - hand.angle;
  return { x, y, angle, tilt: palmTilt(hand.drawPose, hand.side), side: hand.side, scale: hand.scale || 1 };
}

function drawSkinHand(ctx, img, at, h, alpha, pulse) {
  if (!img || !img.complete || !img.naturalWidth) return false;
  const pop = 1 + 0.08 * (pulse > 0 ? pulse : 0);
  const band = h / 3;
  const dh = band * 0.78 * pop * Math.min(1.15, Math.max(0.85, at.scale));
  const dw = dh * (img.naturalWidth / img.naturalHeight);
  ctx.save();
  ctx.translate(at.x, at.y);
  ctx.rotate(at.angle + Math.PI / 2 + at.tilt);
  ctx.globalAlpha = alpha;
  if (pulse > 0.05) {
    ctx.shadowColor = "rgba(255, 214, 140, 0.85)";
    ctx.shadowBlur = Math.max(6, dh * 0.08) * pulse;
  }
  ctx.drawImage(img, -dw * 0.5, -dh * 0.78, dw, dh);
  ctx.restore();
  return true;
}

function createHandViewState() {
  let present = "guard";
  let presence = "idle";
  let drawPose = "guard";
  let seenBoth = false;
  let promptBoth = false;
  let tracking = false;
  let missingSince = 0;
  let cunUntil = 0;
  let hold01 = 0;
  let frozen = [];

  function packOne(packet, action) {
    const lm = packet.lm;
    const imageSide = lm[0].x < 0.5 ? "imageLeft" : "imageRight";
    return {
      x: lm[0].x,
      y: lm[0].y,
      scale: palmScale(lm),
      angle: resolveAngle(action, lm, imageSide),
      side: packet.side,
      drawPose: action,
    };
  }

  return {
    reset() {
      present = "guard";
      presence = "idle";
      drawPose = "guard";
      seenBoth = false;
      promptBoth = false;
      tracking = false;
      missingSince = 0;
      cunUntil = 0;
      hold01 = 0;
      frozen = [];
    },
    setPrompt(on) {
      promptBoth = !!on;
    },
    sync(shape, packets, now) {
      const split = splitHands(packets);
      if (split.presence === "both") {
        const action = shapeToPresent(shape);
        seenBoth = true;
        tracking = true;
        missingSince = 0;
        presence = "both";
        present = action;
        drawPose = action;
        frozen = [packOne(split.left, action), packOne(split.right, action)];
        return { presence: "both", action, holdOff: false };
      }
      if (tracking) {
        tracking = false;
        missingSince = now;
      }
      const inGrace = seenBoth && missingSince && (now - missingSince) < PRESENT_MISS_GRACE_MS;
      if (inGrace) {
        return { presence: "both", action: present, holdOff: false };
      }
      frozen = [];
      presence = split.presence;
      present = seenBoth ? "lost" : "guard";
      drawPose = "guard";
      return { presence, action: present, holdOff: !!seenBoth };
    },
    onHitOk() {
      cunUntil = performance.now() + PRESENT_CUN_MS;
    },
    onHoldProgress(p) {
      hold01 = p > 0 ? Math.min(1, p) : 0;
    },
    paint(ctx, w, h) {
      if (presence !== "both" || frozen.length < 2) return;
      const now = performance.now();
      const pulse = cunUntil && now < cunUntil
        ? Math.sin(Math.min(1, (PRESENT_CUN_MS - (cunUntil - now)) / 220) * Math.PI) || 0
        : 0;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, h * (2 / 3), w, h / 3);
      ctx.clip();
      for (let i = 0; i < frozen.length; i++) {
        const at = placeHand(frozen[i], w, h);
        const img = skinImg[at.side];
        drawSkinHand(ctx, img, at, h, 0.94 + hold01 * 0.06, pulse > 0 ? pulse : 0);
      }
      ctx.restore();
    },
    paintStage() {
      const now = performance.now();
      const canvas = $("handCanvas");
      const tag = $("handTag");
      const host = $("handOverlay");
      const shown = presence === "both" ? present : (presence === "idle" ? "guard" : presence);
      if (host) {
        host.dataset.present = shown;
        host.dataset.hands = presence;
      }
      if (tag) {
        const text = handLabel(present, presence, seenBoth, promptBoth, now, cunUntil);
        const cls = "hand-tag" + (text === "寸劲到位" ? " cun" : text === "请双手入镜" ? " need" : text === "手模丢失，回到框内" ? " lost" : "");
        if (tag.textContent !== text) tag.textContent = text;
        if (tag.className !== cls) tag.className = cls;
        tag.hidden = !text;
      }
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(rect.width * dpr));
      const hgt = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== hgt) {
        canvas.width = w;
        canvas.height = hgt;
      }
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, w, hgt);
      this.paint(ctx, w, hgt);
    },
  };
}

const handViewState = createHandViewState();

function kickHand(vision, delegate) {
  initHand(vision, delegate).then((ok) => {
    if (running) return;
    $("note").textContent = ok
      ? "姿态与手模已就绪（" + delegate + "）。开摄像头后开始；日课可用触控。"
      : "姿态已就绪，手模未加载。日课与触控演示仍可用。";
  }).catch((err) => console.warn("hand", err));
}

async function initHand(vision, preferredDelegate) {
  if (handLandmarker) return true;
  if (handFailed) return false;
  if (!HandLandmarker || !vision) {
    handFailed = true;
    return false;
  }
  if (handLoading) return handLoading;
  const token = handToken;
  const job = (async () => {
    const modelCandidates = [
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      new URL("./mediapipe/hand_landmarker.task", import.meta.url).href,
    ];
    const first = preferredDelegate === "GPU" ? "GPU" : "CPU";
    const delegates = [first, first === "CPU" ? "GPU" : "CPU"];
    let lastErr = null;
    for (const model of modelCandidates) {
      for (const delegate of delegates) {
        if (token !== handToken) return false;
        try {
          const created = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: model, delegate },
            runningMode: "VIDEO",
            numHands: 2,
          });
          if (token !== handToken) {
            if (created && created.close) {
              try { created.close(); } catch (err) { console.warn(err); }
            }
            return false;
          }
          handLandmarker = created;
          console.log("hand ok", { model, delegate });
          return true;
        } catch (e) {
          lastErr = e;
          console.warn("hand fail", model, delegate, e);
        }
      }
    }
    if (token === handToken) {
      handFailed = true;
      console.warn("hand present unavailable", lastErr);
    }
    return false;
  })();
  handLoading = job;
  try {
    return await job;
  } finally {
    if (handLoading === job) handLoading = null;
  }
}

function flash(ok) {
  const cur = required();
  $("flash").className = "flash " + (ok ? "ok" : "bad");
  if (ok) {
    $(cur.armId).classList.add("hit");
    $("demoCard").classList.add("ok-flash");
    $("sil").classList.add("strike");
  }
  const s = $("sfx");
  s.textContent = ok ? cur.ok : cur.bad;
  s.classList.remove("show");
  void s.offsetWidth;
  s.classList.add("show");
  setTimeout(() => {
    $("flash").className = "flash";
    $("armRU").classList.remove("hit");
    $("armMid").classList.remove("hit");
    $("sil").classList.remove("strike");
    $("demoCard").classList.remove("ok-flash");
  }, ok ? 200 : (cur.sil === "bong" ? 140 : 90));
}

function onHitValid(fromTouch) {
  if (handGatePaused && !fromTouch) return;
  const now = performance.now();
  if (now - lastHitAt < POST_HIT_COOLDOWN) return;
  lastHitAt = now;
  holdShape = null;
  holdCount = 0;
  holdAccum = 0;
  holdLastTs = 0;
  flash(true);
  handViewState.onHitOk();
  step += 1;
  $("count").textContent = step + " / 10 · 识别：ok";
  if (step >= 10) {
    finish(true);
    return;
  }
  applyStepVisual();
  showBanner("冷却中 · 2 秒后可下一击", 1200);
}

function onHitWrong(msg) {
  const now = performance.now();
  if (now - lastWrongAt < WRONG_COOLDOWN) return;
  lastWrongAt = now;
  flash(false);
  showBanner(msg || ("须出" + required().name), 800);
}


function setHoldUI(on, sil, sec, pct) {
  const track = $("holdTrack");
  const bar = $("holdBar");
  const meta = $("holdMeta");
  if (!track || !bar) return;
  if (!on) {
    track.classList.remove("show");
    if (meta) meta.classList.remove("show");
    bar.style.width = "0%";
    bar.style.display = "none";
    return;
  }
  track.classList.add("show");
  bar.style.display = "block";
  bar.className = "hold-bar " + (sil || "punch");
  bar.style.width = Math.max(0, Math.min(100, pct)) + "%";
  if (meta) {
    meta.classList.add("show");
    const name = sil === "bong" ? "膀态维持中" : "冲态维持中";
    meta.textContent = name + " " + sec.toFixed(1) + "/3s · " + Math.round(pct) + "%";
  }
}

function applyCandidate(c) {
  const now = performance.now();
  const label = c.shape + (c.detail ? ` ${c.detail}` : "");
  $("count").textContent = `${step} / 10 · 识别：${c.shape}/${c.quality}`;

  if (c.quality === "lost") {
    lostStreak += 1;
    holdShape = null;
    holdCount = 0;
    holdAccum = 0;
    holdLastTs = 0;
    if (lostStreak >= LOST_FRAMES) {
      if (running) setPaused(true);
      $("camStatus").textContent = "回到框内";
    } else {
      $("camStatus").textContent = "识别中…";
    }
    return;
  }
  lostStreak = 0;
  if (paused) setPaused(false);

  if (!running || step >= 10) {
    $("camStatus").textContent = label;
    return;
  }

  if (handGatePaused) {
    holdShape = null;
    holdCount = 0;
    holdAccum = 0;
    holdLastTs = 0;
    setHoldUI(false);
    $("camStatus").textContent = "请双手入镜";
    return;
  }

  const need = required();
  const coolLeft = lastHitAt ? POST_HIT_COOLDOWN - (now - lastHitAt) : 0;
  if (coolLeft > 0) {
    $("camStatus").textContent = "冷却中 " + Math.ceil(coolLeft / 1000) + "s";
    holdAccum = 0;
    holdLastTs = 0;
    holdShape = null;
    holdCount = 0;
    setHoldUI(false);
    return;
  }

  if (c.shape === "unknown") {
    if (holdAccum > 0) showBanner("保持姿势", 800);
    holdAccum = 0;
    holdLastTs = 0;
    holdShape = null;
    holdCount = 0;
    setHoldUI(false);
    $("camStatus").textContent = label;
    return;
  }

  if (c.shape !== need.shape) {
    if (holdAccum > 0) showBanner("保持姿势", 800);
    holdShape = null;
    holdCount = 0;
    holdAccum = 0;
    holdLastTs = 0;
    setHoldUI(false);
    onHitWrong("须出" + need.name);
    $("camStatus").textContent = label;
    return;
  }

  // 路径 B：ok 或 near 均可蓄 3s 维持
  if (c.quality === "ok" || c.quality === "near") {
    if (holdShape === c.shape && holdLastTs) holdAccum += now - holdLastTs;
    else { holdShape = c.shape; holdAccum = 0; }
    holdLastTs = now;
    const sec = Math.min(HOLD_PASS_MS / 1000, holdAccum / 1000);
    const pct = Math.floor((holdAccum / HOLD_PASS_MS) * 100);
    const tag = need.sil === "punch" ? "冲态维持中" : "膀态维持中";
    setHoldUI(true, need.sil, sec, pct);
    $("camStatus").textContent = tag + " " + sec.toFixed(1) + "/3s · " + pct + "%";
    $("count").textContent = `${step} / 10 · ${tag} ${pct}%`;
    if (holdAccum >= HOLD_PASS_MS) {
      setHoldUI(false);
      onHitValid();
      return;
    }
  } else {
    holdAccum = 0;
    holdLastTs = 0;
  }

  // 路径 A：瞬时 ok + 短去抖（原判定）
  if (c.quality === "ok") {
    if (holdShape === c.shape) holdCount += 1;
    else { holdCount = 1; }
    if (holdCount >= HOLD_FRAMES) {
      setHoldUI(false);
      onHitValid();
      return;
    }
  }

  if (c.quality === "near" && holdAccum <= 0) {
    showBanner("再送一寸", 500);
  }
}


function predictLoop() {
  try {
    const video = $("video");
    if (poseLandmarker && camReady && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const syncTs = nextSyncTs(performance.now());
      const result = poseLandmarker.detectForVideo(video, syncTs);
      let handPoints = null;
      if (handLandmarker) {
        try {
          const handResult = handLandmarker.detectForVideo(video, syncTs);
          const marks = (handResult && handResult.landmarks) || [];
          const handed = (handResult && handResult.handedness) || [];
          handPoints = marks.map((lm, i) => {
            const cat = handed[i] && handed[i][0];
            const name = cat && (cat.categoryName || cat.displayName || "");
            return {
              lm,
              side: name === "Left" || name === "Right" ? name : "",
              score: cat && cat.score ? cat.score : 0,
            };
          });
        } catch (err) {
          console.warn("hand frame", err);
          handPoints = [];
        }
      }
      const lm = result && result.landmarks && result.landmarks[0];
      const candidate = lm
        ? classifyPose(lm)
        : { shape: "unknown", quality: "lost", confidence: 0, detail: "无人" };
      if (handPoints) {
        const view = handViewState.sync(candidate.shape, handPoints, syncTs);
        if (awaitBoth && !running && view.presence === "both") {
          awaitBoth = false;
          handFollow = true;
          beginRound();
        }
        if (handFollow && running) setHandGatePause(!!view.holdOff);
      }
      if (lm || running) applyCandidate(candidate);
      if (awaitBoth && !running) $("camStatus").textContent = "请双手入镜";
      handViewState.onHoldProgress(running && holdAccum > 0 ? holdAccum / HOLD_PASS_MS : 0);

      const canvas = $("overlayCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (lm) {
        const arm = pickArm(lm);
        if (arm) {
          ctx.fillStyle = "rgba(232,215,195,0.85)";
          for (const p of [arm.sh, arm.el, arm.wr]) {
            ctx.beginPath();
            ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.strokeStyle = "rgba(232,90,42,0.7)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(arm.sh.x * canvas.width, arm.sh.y * canvas.height);
          ctx.lineTo(arm.el.x * canvas.width, arm.el.y * canvas.height);
          ctx.lineTo(arm.wr.x * canvas.width, arm.wr.y * canvas.height);
          ctx.stroke();
        }
      }
    }
  } catch (err) {
    console.error(err);
  }
  try { handViewState.paintStage(); } catch (err) { console.error(err); }
  requestAnimationFrame(predictLoop);
}

function beginRound() {
  if (running) return;
  running = true;
  if (mode !== "contest") $("btnStrike").disabled = false;
  endAt = performance.now() + left * 1000;
  $("instr").textContent = "交错击桩 · 听指示换招。1 分钟内按序有效击 10 次；维持 3 秒或瞬时有效均可过；击后冷却 2 秒。";
  applyStepVisual();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
}

async function start() {
  resetIdle();
  const okCam = await ensureCamera();
  if (!okCam && mode === "contest") {
    showBanner("比赛专用需摄像头，请先点「开启摄像头」", 2000);
    $("camStatus").textContent = "待开启";
    return;
  }
  try { await initPose(); }
  catch (e) {
    const msg = (e && (e.message || String(e))) || "未知错误";
    if (!poseLandmarker) {
      $("camStatus").textContent = "模型失败";
      $("note").textContent = "姿态模型加载失败：" + msg + "。日课可用触控演示；可点「重试模型」。";
    }
    console.error(e);
  }
  if (handLoading) {
    try {
      await Promise.race([
        handLoading,
        new Promise((resolve) => setTimeout(resolve, 2500)),
      ]);
    } catch (err) { console.warn(err); }
  }
  if (!okCam && mode === "drill") {
    showBanner("摄像头未开，可用触控演示跑谱", 1800);
  }
  if (mode === "drill" && okCam && handLandmarker) {
    awaitBoth = true;
    handFollow = false;
    handViewState.setPrompt(true);
    if (mode !== "contest") $("btnStrike").disabled = false;
    $("camStatus").textContent = "请双手入镜";
    $("note").textContent = "双手同时入镜后开课。触控演示可不经双手。";
    return;
  }
  beginRound();
}

function finish(pass) {
  running = false;
  awaitBoth = false;
  handFollow = false;
  $("btnStrike").disabled = true;
  cancelAnimationFrame(raf);
  setHandGatePause(false);
  setPaused(false);
  $("hud").classList.remove("urgent");
  $("armRU").classList.remove("target-punch", "target-bong");
  $("armMid").classList.remove("target-punch", "target-bong");
  const contest = mode === "contest";
  $("resultTitle").textContent = pass
    ? (contest ? "咏春比赛专用 · 达成" : "过关。下一课。")
    : (contest ? "咏春比赛专用 · 未达成" : "再来一课。");
  $("resultBody").textContent =
    `完成 ${step}/10 · 剩余 ${Math.ceil(left)}s · 谱：` +
    SEQ.map((id) => MOVES[id].short).join("-");
  $("overlay").classList.add("show");
}

function tryTapFallback() {
  if (mode === "contest" || step >= 10) return;
  if (!running) {
    awaitBoth = false;
    handFollow = false;
    setHandGatePause(false);
    handViewState.setPrompt(false);
    beginRound();
  }
  onHitValid(true);
}

$("btnMode").onclick = () => {
  mode = mode === "drill" ? "contest" : "drill";
  setModeUI();
};
$("btnStart").onclick = () => { start(); };
$("btnAgain").onclick = () => { start(); };
async function openCameraFromClick() {
  const ok = await ensureCamera();
  if (!ok) return;
  if (!handLandmarker) handFailed = false;
  try { await initPose(); } catch (e) { console.error(e); }
}

$("btnCam").onclick = () => { openCameraFromClick(); };
$("btnCamDock").onclick = () => { openCameraFromClick(); };
$("btnStrike").onclick = tryTapFallback;

resetIdle();
$("camStatus").textContent = "待开启 · 请点「开启摄像头」";
$("note").textContent = secureHint() || "先点「开启摄像头」允许权限，再点开始（须 HTTPS 或 localhost；同目录需 mediapipe/）";

$("btnRetryModel") && ($("btnRetryModel").onclick = () => {
  if (handLandmarker && handLandmarker.close) {
    try { handLandmarker.close(); } catch (err) { console.warn(err); }
  }
  handToken += 1;
  handLandmarker = null;
  handFailed = false;
  handLoading = null;
  poseLandmarker = null;
  poseLoading = null;
  PoseLandmarker = null;
  HandLandmarker = null;
  FilesetResolver = null;
  initPose().then(() => showBanner(handLandmarker ? "姿态与手模已就绪" : "姿态已就绪", 1000)).catch((e) => {
    showBanner("模型仍失败", 1400);
    console.error(e);
  });
});

predictLoop();
(async () => {
  try {
    if (window.isSecureContext) await initPose();
  } catch (e) {
    console.error(e);
    const msg = (e && (e.message || String(e))) || "未知错误";
    $("camStatus").textContent = "模型失败";
    $("note").textContent = "姿态模型预加载失败：" + msg + "。日课可用触控；可点「重试模型」或确认 mediapipe/ 同目录。";
  }
})();
</script>
